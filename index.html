y","ar":"إشارتك تعطيك الأفضلية"},{"en":"Mirrors become unnecessary","ar":"تصبح المرايا غير ضرورية"}],"correct":0,"exp":{"en":"Blind-spot checks are important before lateral movement.","ar":"فحص النقطة العمياء مهم قبل أي حركة جانبية."}},{"id":1115,"tracks":["private"],"cat":"parking","source":"principle","q":{"en":"When should you stop a parking manoeuvre immediately?","ar":"متى يجب أن توقف مناورة الركن فوراً؟"},"a":[{"en":"When a pedestrian, cyclist or vehicle enters the manoeuvre path","ar":"عندما يدخل مشاة أو دراجة أو مركبة في مسار المناورة"},{"en":"When the steering is turned","ar":"عند لف المقود"},{"en":"When the engine is running","ar":"عندما يكون المحرك شغالاً"},{"en":"When a passenger speaks","ar":"عندما يتحدث راكب"}],"correct":0,"exp":{"en":"Safety of people and surrounding traffic takes priority over completing the manoeuvre.","ar":"سلامة الأشخاص وحركة السير المحيطة أهم من إكمال المناورة."}},{"id":1116,"tracks":["private"],"cat":"weather","source":"principle","q":{"en":"On a slippery road, what steering style is safest?","ar":"على طريق زلق، ما أسلوب التوجيه الأكثر أماناً؟"},"a":[{"en":"Smooth and progressive steering","ar":"توجيه سلس وتدريجي"},{"en":"Sharp sudden steering","ar":"توجيه حاد ومفاجئ"},{"en":"Repeated swerving","ar":"تعرج متكرر"},{"en":"Hands off the wheel","ar":"ترك المقود"}],"correct":0,"exp":{"en":"Smooth inputs reduce the chance of losing grip.","ar":"الحركات السلسة تقلل احتمال فقدان التماسك."}},{"id":1117,"tracks":["private"],"cat":"vehicle","source":"principle","q":{"en":"Why is correct tyre pressure important?","ar":"لماذا ضغط الإطارات الصحيح مهم؟"},"a":[{"en":"It affects grip, braking, stability and tyre condition","ar":"يؤثر على التماسك والفرملة والثبات وحالة الإطار"},{"en":"Only for appearance","ar":"للمظهر فقط"},{"en":"Only for horn sound","ar":"لصوت الزمور فقط"},{"en":"It changes road signs","ar":"يغير إشارات السير"}],"correct":0,"exp":{"en":"Tyres are the vehicle’s contact with the road.","ar":"الإطارات هي نقطة اتصال المركبة بالطريق."}},{"id":1118,"tracks":["private"],"cat":"signals","source":"principle","q":{"en":"When leaving a parking space, what does your indicator mean?","ar":"عند مغادرة موقف، ماذا تعني إشارة الانعطاف التي تشغلها؟"},"a":[{"en":"It communicates your intention but does not give you priority","ar":"تبلغ الآخرين بنيتك لكنها لا تعطيك الأفضلية"},{"en":"It gives you automatic priority","ar":"تعطيك أولوية تلقائية"},{"en":"It forces traffic to stop","ar":"تجبر السير على التوقف"},{"en":"It replaces mirror checks","ar":"تستبدل فحص المرايا"}],"correct":0,"exp":{"en":"Signals communicate; they do not remove the duty to observe and yield.","ar":"الإشارة وسيلة تواصل ولا تلغي واجب المراقبة وإعطاء الأولوية."}},{"id":1119,"tracks":["private"],"cat":"safety","source":"principle","q":{"en":"If sunlight glare prevents you from seeing clearly, what should you do?","ar":"إذا منعك وهج الشمس من الرؤية بوضوح، ماذا تفعل؟"},"a":[{"en":"Reduce speed and restore adequate visibility","ar":"خفف السرعة وحاول استعادة رؤية كافية"},{"en":"Maintain speed","ar":"حافظ على السرعة"},{"en":"Look away from the road","ar":"انظر بعيداً عن الطريق"},{"en":"Follow the car ahead very closely","ar":"اقترب جداً من السيارة أمامك"}],"correct":0,"exp":{"en":"You must be able to see enough road to react safely.","ar":"يجب أن ترى مساحة كافية من الطريق للاستجابة بأمان."}},{"id":1120,"tracks":["private"],"cat":"emergency","source":"principle","q":{"en":"If your car breaks down in a dangerous position, what is the priority?","ar":"إذا تعطلت سيارتك في موقع خطر، ما هي الأولوية؟"},"a":[{"en":"Warn other road users and move to a safer position if possible","ar":"حذر مستخدمي الطريق وانتقل إلى مكان أكثر أماناً إذا أمكن"},{"en":"Stay in a live lane without warning","ar":"ابق في مسار السير دون تحذير"},{"en":"Turn off all lights","ar":"أطفئ كل الأضواء"},{"en":"Leave the car unlocked in the lane","ar":"اترك السيارة مفتوحة في المسار"}],"correct":0,"exp":{"en":"Make the breakdown visible and reduce exposure to traffic when it is safe to do so.","ar":"اجعل العطل واضحاً للآخرين وقلل التعرض لحركة السير عندما يكون ذلك ممكناً بأمان."}},{"id":1201,"tracks":["public"],"cat":"passenger_safety","source":"principle","q":{"en":"Before pulling away from a passenger stop, what must the driver confirm?","ar":"قبل الانطلاق من موقف ركاب، ماذا يجب على السائق أن يتأكد؟"},"a":[{"en":"Passengers are safely aboard, doors are secure and the road is clear","ar":"أن الركاب صعدوا بأمان والأبواب مؤمنة والطريق واضح"},{"en":"The fare is counted while moving","ar":"أن الأجرة تُعد أثناء الحركة"},{"en":"The horn is sounding","ar":"أن الزمور يعمل"},{"en":"The vehicle behind has stopped","ar":"أن المركبة خلفه توقفت"}],"correct":0,"exp":{"en":"Passenger safety and safe re-entry into traffic come before moving.","ar":"سلامة الركاب والعودة الآمنة إلى حركة السير تسبقان الانطلاق."}},{"id":1202,"tracks":["public"],"cat":"passenger_safety","source":"principle","q":{"en":"Why should a public driver brake earlier and more progressively than necessary for an empty vehicle?","ar":"لماذا يجب على السائق العمومي الفرملة مبكراً وبشكل تدريجي؟"},"a":[{"en":"To protect standing or seated passengers from sudden movement","ar":"لحماية الركاب الجالسين أو الواقفين من الحركة المفاجئة"},{"en":"To arrive later","ar":"للوصول متأخراً"},{"en":"To use more fuel","ar":"لاستهلاك وقود أكثر"},{"en":"To avoid mirrors","ar":"لتجنب المرايا"}],"correct":0,"exp":{"en":"Smooth deceleration reduces passenger falls and improves control.","ar":"التباطؤ السلس يقلل سقوط الركاب ويحسن التحكم."}},{"id":1203,"tracks":["public"],"cat":"passenger","source":"traffic_2019","q":{"en":"What should a public-service vehicle respect regarding passenger numbers?","ar":"بماذا يجب أن تلتزم المركبة العمومية بالنسبة لعدد الركاب؟"},"a":[{"en":"The permitted passenger capacity","ar":"عدد الركاب المسموح به"},{"en":"Any number if the trip is short","ar":"أي عدد إذا كانت الرحلة قصيرة"},{"en":"Double the seat count at night","ar":"ضعف عدد المقاعد ليلاً"},{"en":"No limit on local roads","ar":"لا حد على الطرق المحلية"}],"correct":0,"exp":{"en":"The traffic-law guide treats exceeding permitted passenger numbers as a violation.","ar":"يعالج دليل قانون السير تجاوز عدد الركاب المسموح به كمخالفة."}},{"id":1204,"tracks":["public"],"cat":"passenger","source":"traffic_2019","q":{"en":"What should you avoid when transporting passengers or goods?","ar":"ماذا يجب تجنبه عند نقل الركاب أو البضائع؟"},"a":[{"en":"Exceeding legal load, dimensions or passenger limits","ar":"تجاوز الحمولة أو القياسات أو عدد الركاب القانوني"},{"en":"Checking tyres","ar":"فحص الإطارات"},{"en":"Carrying required documents","ar":"حمل الأوراق المطلوبة"},{"en":"Using mirrors","ar":"استعمال المرايا"}],"correct":0,"exp":{"en":"The guide and current enforcement emphasize legal load, dimensions and passenger count.","ar":"يشدد الدليل والحملات المرورية على الحمولة والقياسات وعدد الركاب ضمن الحدود القانونية."}},{"id":1205,"tracks":["public"],"cat":"passenger_safety","source":"principle","q":{"en":"Where should luggage be placed in a public passenger vehicle?","ar":"أين يجب وضع أمتعة الركاب في مركبة نقل عمومي؟"},"a":[{"en":"So it is secured and does not block doors, visibility or emergency movement","ar":"بحيث تكون مثبتة ولا تعيق الأبواب أو الرؤية أو الحركة الطارئة"},{"en":"Loose in the aisle","ar":"بشكل حر في الممر"},{"en":"On the driver’s lap","ar":"على حضن السائق"},{"en":"In front of the windscreen","ar":"أمام الزجاج الأمامي"}],"correct":0,"exp":{"en":"Luggage should not create a projectile, visibility or evacuation hazard.","ar":"يجب ألا تصبح الأمتعة خطراً على الركاب أو الرؤية أو الخروج من المركبة."}},{"id":1206,"tracks":["public"],"cat":"passenger_safety","source":"principle","q":{"en":"What is the safest way to collect or return change to a passenger?","ar":"ما الطريقة الأكثر أماناً لاستلام أو إعادة باقي الأجرة للراكب؟"},"a":[{"en":"When the vehicle is safely stopped","ar":"عندما تكون المركبة متوقفة بأمان"},{"en":"While turning at an intersection","ar":"أثناء الانعطاف في تقاطع"},{"en":"At high speed","ar":"أثناء السرعة العالية"},{"en":"While using a phone","ar":"أثناء استعمال الهاتف"}],"correct":0,"exp":{"en":"Money handling can distract the driver and should not compete with vehicle control.","ar":"التعامل مع المال قد يشتت السائق ويجب ألا ينافس التحكم بالمركبة."}},{"id":1207,"tracks":["public"],"cat":"passenger_safety","source":"principle","q":{"en":"A passenger asks to stop at a dangerous bend. What should the driver do?","ar":"طلب راكب التوقف عند منعطف خطر. ماذا يفعل السائق؟"},"a":[{"en":"Continue to the nearest safe and legal stopping place","ar":"تابع إلى أقرب مكان توقف آمن وقانوني"},{"en":"Stop immediately in the bend","ar":"توقف فوراً داخل المنعطف"},{"en":"Open the door while moving","ar":"افتح الباب أثناء الحركة"},{"en":"Reverse to the previous junction","ar":"ارجع للخلف إلى التقاطع السابق"}],"correct":0,"exp":{"en":"Passenger convenience does not override road safety.","ar":"راحة الراكب لا تتقدم على سلامة الطريق."}},{"id":1208,"tracks":["public"],"cat":"vehicle","source":"principle","q":{"en":"Why does a public driver need a strong pre-shift vehicle check?","ar":"لماذا يحتاج السائق العمومي إلى فحص قوي للمركبة قبل بدء العمل؟"},"a":[{"en":"The vehicle may carry multiple passengers for many trips","ar":"لأن المركبة قد تنقل عدة ركاب في رحلات متعددة"},{"en":"To change its colour","ar":"لتغيير لونها"},{"en":"To avoid carrying documents","ar":"لتجنب حمل الأوراق"},{"en":"To increase horn volume","ar":"لزيادة صوت الزمور"}],"correct":0,"exp":{"en":"Public service increases exposure and responsibility, making defects more consequential.","ar":"الخدمة العمومية تزيد زمن الاستخدام والمسؤولية، ما يجعل الأعطال أكثر خطورة."}},{"id":1209,"tracks":["public"],"cat":"passenger_safety","source":"principle","q":{"en":"When carrying an elderly passenger, what driving style is preferable?","ar":"عند نقل راكب مسن، ما أسلوب القيادة الأفضل؟"},"a":[{"en":"Smooth acceleration, gentle braking and extra boarding time","ar":"تسارع سلس وفرملة لطيفة ووقت إضافي للصعود والنزول"},{"en":"Sharp acceleration","ar":"تسارع حاد"},{"en":"Late braking","ar":"فرملة متأخرة"},{"en":"Fast cornering","ar":"منعطفات سريعة"}],"correct":0,"exp":{"en":"Smooth movements reduce loss of balance and discomfort.","ar":"الحركات السلسة تقلل فقدان التوازن والانزعاج."}},{"id":1210,"tracks":["public"],"cat":"passenger_safety","source":"principle","q":{"en":"If a passenger becomes ill during the trip, what should the driver do first?","ar":"إذا شعر راكب بوعكة أثناء الرحلة، ماذا يفعل السائق أولاً؟"},"a":[{"en":"Find a safe place to stop and assess what help is needed","ar":"ابحث عن مكان آمن للتوقف وقيّم نوع المساعدة المطلوبة"},{"en":"Continue at higher speed","ar":"تابع بسرعة أعلى"},{"en":"Ignore the passenger","ar":"تجاهل الراكب"},{"en":"Stop in the middle of a junction","ar":"توقف في وسط تقاطع"}],"correct":0,"exp":{"en":"You should protect traffic safety while responding to the passenger’s needs.","ar":"يجب الحفاظ على سلامة السير أثناء الاستجابة لحاجة الراكب."}},{"id":1211,"tracks":["public"],"cat":"documents","source":"traffic_2019","q":{"en":"Which group of documents can be important for a public/commercial driver?","ar":"أي مجموعة من الأوراق قد تكون مهمة لسائق عمومي أو تجاري؟"},"a":[{"en":"Driving licence, vehicle registration, insurance and required public-service documents","ar":"رخصة السوق ورخصة السير والتأمين وأوراق الخدمة العمومية المطلوبة"},{"en":"Only a personal business card","ar":"بطاقة عمل شخصية فقط"},{"en":"Only a fuel receipt","ar":"فاتورة وقود فقط"},{"en":"Only a passenger list","ar":"لائحة ركاب فقط"}],"correct":0,"exp":{"en":"Public/commercial driving requires both ordinary vehicle documents and any applicable service documents.","ar":"القيادة العمومية أو التجارية تتطلب أوراق المركبة العادية وأي مستندات خدمة مطلوبة."}},{"id":1212,"tracks":["public"],"cat":"safety","source":"principle","q":{"en":"Why should a public driver avoid long conversations with passengers while moving?","ar":"لماذا يجب على السائق العمومي تجنب المحادثات الطويلة مع الركاب أثناء السير؟"},"a":[{"en":"They can reduce concentration and hazard awareness","ar":"قد تقلل التركيز والانتباه للمخاطر"},{"en":"They increase tyre wear","ar":"تزيد اهتراء الإطارات"},{"en":"They change road priority","ar":"تغير أولوية المرور"},{"en":"They disable indicators","ar":"تعطل الإشارات"}],"correct":0,"exp":{"en":"Driving attention should remain primarily on the road environment.","ar":"يجب أن يبقى انتباه السائق أساساً على بيئة الطريق."}},{"id":1213,"tracks":["public"],"cat":"passenger_safety","source":"principle","q":{"en":"What should the driver do if a passenger tries to open a door before the vehicle stops?","ar":"ماذا يفعل السائق إذا حاول راكب فتح الباب قبل توقف المركبة؟"},"a":[{"en":"Prevent unsafe exit and stop safely before allowing the passenger out","ar":"امنع النزول غير الآمن وتوقف بأمان قبل السماح بالخروج"},{"en":"Accelerate","ar":"تسارع"},{"en":"Keep moving with the door open","ar":"تابع السير والباب مفتوح"},{"en":"Turn sharply","ar":"انعطف فجأة"}],"correct":0,"exp":{"en":"Passenger exit should occur only when the vehicle is safely stopped.","ar":"يجب أن يتم نزول الركاب فقط عندما تكون المركبة متوقفة بأمان."}},{"id":1214,"tracks":["public"],"cat":"parking","source":"traffic_2019","q":{"en":"Why should public vehicles avoid stopping where boarding would occur in an unsafe place?","ar":"لماذا يجب أن تتجنب المركبات العمومية التوقف في مكان غير آمن لصعود أو نزول الركاب؟"},"a":[{"en":"It can expose passengers directly to moving traffic","ar":"قد يعرّض الركاب مباشرة لحركة السير"},{"en":"It makes the trip too short","ar":"يجعل الرحلة قصيرة جداً"},{"en":"It changes the fare","ar":"يغير الأجرة"},{"en":"It improves traffic flow","ar":"يحسن حركة السير"}],"correct":0,"exp":{"en":"The traffic-law guide regulates stopping and passenger boarding/alighting locations.","ar":"ينظم دليل قانون السير أماكن التوقف وصعود ونزول الركاب."}},{"id":1215,"tracks":["public"],"cat":"vehicle","source":"principle","q":{"en":"If the vehicle feels overloaded or handles abnormally, what should a public driver do?","ar":"إذا بدت المركبة محملة أكثر من اللازم أو تغير سلوكها، ماذا يفعل السائق العمومي؟"},"a":[{"en":"Stop safely and resolve the load/safety issue before continuing","ar":"توقف بأمان وعالج مشكلة الحمولة أو السلامة قبل المتابعة"},{"en":"Drive faster","ar":"قد أسرع"},{"en":"Ignore the handling change","ar":"تجاهل تغير التحكم"},{"en":"Reduce tyre pressure","ar":"خفف ضغط الإطارات"}],"correct":0,"exp":{"en":"Abnormal handling may indicate unsafe load distribution or another defect.","ar":"تغير التحكم قد يدل على توزيع حمولة غير آمن أو عطل آخر."}},{"id":1216,"tracks":["public"],"cat":"passenger_safety","source":"principle","q":{"en":"When approaching a stop with people waiting near the kerb, what should you anticipate?","ar":"عند الاقتراب من موقف وفيه أشخاص ينتظرون قرب الرصيف، ماذا يجب أن تتوقع؟"},"a":[{"en":"Someone may step into the road unexpectedly","ar":"قد يدخل شخص إلى الطريق بشكل مفاجئ"},{"en":"Everyone will remain still","ar":"سيبقى الجميع ثابتين"},{"en":"You have automatic priority","ar":"لديك أولوية تلقائية"},{"en":"The road is closed","ar":"الطريق مغلق"}],"correct":0,"exp":{"en":"Passenger stops require extra observation for unpredictable movement.","ar":"مواقف الركاب تتطلب مراقبة إضافية للحركة غير المتوقعة."}},{"id":1217,"tracks":["public"],"cat":"passenger_safety","source":"principle","q":{"en":"What should happen before a public vehicle merges back into traffic after a stop?","ar":"ماذا يجب أن يحدث قبل عودة المركبة العمومية إلى حركة السير بعد التوقف؟"},"a":[{"en":"Mirrors, signal if needed, blind-spot check and a safe gap","ar":"المرايا والإشارة عند الحاجة وفحص النقطة العمياء وفجوة آمنة"},{"en":"Move immediately when the door closes","ar":"التحرك فور إغلاق الباب"},{"en":"Use the horn and force entry","ar":"استعمل الزمور وادخل بالقوة"},{"en":"Ignore motorcycles","ar":"تجاهل الدراجات"}],"correct":0,"exp":{"en":"A safe merge requires observation and communication.","ar":"الاندماج الآمن يتطلب المراقبة والتواصل."}},{"id":1218,"tracks":["public"],"cat":"safety","source":"principle","q":{"en":"If passengers are distracting the driver, what is the safest response?","ar":"إذا كان الركاب يشتتون السائق، ما هو التصرف الأكثر أماناً؟"},"a":[{"en":"Set boundaries and, if necessary, stop safely before dealing with the issue","ar":"ضع حدوداً وعند الحاجة توقف بأمان لمعالجة المشكلة"},{"en":"Argue while driving","ar":"جادل أثناء القيادة"},{"en":"Use the phone to call someone while moving","ar":"استعمل الهاتف للاتصال أثناء السير"},{"en":"Speed up to finish the trip","ar":"زد السرعة لإنهاء الرحلة"}],"correct":0,"exp":{"en":"The driver must preserve concentration and control.","ar":"على السائق الحفاظ على التركيز والسيطرة."}},{"id":1219,"tracks":["public"],"cat":"passenger","source":"principle","q":{"en":"Why should a public driver know the vehicle’s legal seating capacity?","ar":"لماذا يجب على السائق العمومي معرفة السعة القانونية للمقاعد؟"},"a":[{"en":"To avoid unsafe and unlawful overloading","ar":"لتجنب الحمولة الزائدة غير الآمنة وغير القانونية"},{"en":"To choose radio volume","ar":"لاختيار صوت الراديو"},{"en":"To calculate tyre colour","ar":"لحساب لون الإطارات"},{"en":"To increase speed","ar":"لزيادة السرعة"}],"correct":0,"exp":{"en":"Capacity limits are part of safe and legal passenger transport.","ar":"حدود السعة جزء من نقل الركاب بشكل آمن وقانوني."}},{"id":1220,"tracks":["public"],"cat":"emergency","source":"principle","q":{"en":"If a public vehicle breaks down with passengers aboard, what should the driver prioritize?","ar":"إذا تعطلت مركبة عمومية وبداخلها ركاب، ما الأولوية؟"},"a":[{"en":"Secure the vehicle and passengers away from traffic danger","ar":"تأمين المركبة والركاب بعيداً عن خطر حركة السير"},{"en":"Leave passengers in an exposed lane","ar":"ترك الركاب في مسار مكشوف"},{"en":"Restart repeatedly without warning traffic","ar":"محاولة التشغيل المتكرر دون تحذير السير"},{"en":"Block an intersection","ar":"إغلاق تقاطع"}],"correct":0,"exp":{"en":"Passenger safety and warning other road users come before restarting the trip.","ar":"سلامة الركاب وتحذير مستخدمي الطريق تسبقان استكمال الرحلة."}},{"id":1301,"tracks":["motorcycle"],"cat":"motorcycle","source":"principle","q":{"en":"Why should motorcycle riders make themselves visible to other drivers?","ar":"لماذا يجب على راكب الدراجة أن يجعل نفسه واضحاً للسائقين الآخرين؟"},"a":[{"en":"Motorcycles are smaller and easier to overlook","ar":"لأن الدراجة أصغر وأسهل أن لا يلاحظها الآخرون"},{"en":"To use more fuel","ar":"لاستهلاك وقود أكثر"},{"en":"To reduce braking","ar":"لتقليل الفرملة"},{"en":"To avoid wearing a helmet","ar":"لتجنب الخوذة"}],"correct":0,"exp":{"en":"Visibility is a major motorcycle safety issue because of the motorcycle’s small profile.","ar":"الوضوح للآخرين مسألة سلامة أساسية بسبب الحجم الصغير للدراجة."}},{"id":1302,"tracks":["motorcycle"],"cat":"motorcycle","source":"principle","q":{"en":"Before entering a bend on a motorcycle, what is a good practice?","ar":"قبل دخول منعطف بالدراجة، ما الممارسة الجيدة؟"},"a":[{"en":"Adjust speed before the bend and look through the intended path","ar":"اضبط السرعة قبل المنعطف وانظر نحو المسار المقصود"},{"en":"Brake hard only after leaning fully","ar":"افرمل بقوة بعد الميل الكامل"},{"en":"Look at the front wheel","ar":"انظر إلى العجلة الأمامية"},{"en":"Accelerate regardless of visibility","ar":"تسارع مهما كانت الرؤية"}],"correct":0,"exp":{"en":"Setting speed before the bend supports stability and observation.","ar":"ضبط السرعة قبل المنعطف يساعد على الثبات والمراقبة."}},{"id":1303,"tracks":["motorcycle"],"cat":"moto_control","source":"principle","q":{"en":"What can sudden throttle or brake inputs do on a slippery surface?","ar":"ماذا قد تسبب الحركات المفاجئة للوقود أو الفرامل على سطح زلق؟"},"a":[{"en":"Reduce grip and upset motorcycle stability","ar":"تقلل التماسك وتخل بثبات الدراجة"},{"en":"Guarantee more grip","ar":"تضمن تماسكاً أكبر"},{"en":"Shorten every stopping distance","ar":"تقلل كل مسافات التوقف"},{"en":"Make tyres wider","ar":"تجعل الإطارات أعرض"}],"correct":0,"exp":{"en":"Smooth control inputs are especially important where grip is reduced.","ar":"التحكم السلس مهم بشكل خاص عندما يكون التماسك منخفضاً."}},{"id":1304,"tracks":["motorcycle"],"cat":"moto_control","source":"principle","q":{"en":"When braking normally on a motorcycle, what is the general goal?","ar":"عند الفرملة العادية بالدراجة، ما الهدف العام؟"},"a":[{"en":"Use controlled progressive braking while keeping stability","ar":"استعمال فرملة تدريجية مضبوطة مع الحفاظ على الثبات"},{"en":"Lock a wheel deliberately","ar":"قفل إحدى العجلتين عمداً"},{"en":"Use only the horn","ar":"استعمل الزمور فقط"},{"en":"Close your eyes","ar":"أغمض عينيك"}],"correct":0,"exp":{"en":"Progressive braking helps preserve tyre grip and balance.","ar":"الفرملة التدريجية تساعد في الحفاظ على تماسك الإطارات والتوازن."}},{"id":1305,"tracks":["motorcycle"],"cat":"motorcycle","source":"principle","q":{"en":"Why is lane position important for a motorcyclist?","ar":"لماذا موقع الدراجة داخل المسار مهم؟"},"a":[{"en":"It affects visibility, escape space and how others see the rider","ar":"يؤثر على الرؤية ومساحة الهروب ومدى وضوح الراكب للآخرين"},{"en":"It only affects fuel price","ar":"يؤثر فقط على سعر الوقود"},{"en":"It changes helmet size","ar":"يغير حجم الخوذة"},{"en":"It removes blind spots completely","ar":"يلغي النقاط العمياء نهائياً"}],"correct":0,"exp":{"en":"Good lane position helps the rider see, be seen and preserve space.","ar":"الموقع الجيد يساعد الراكب على الرؤية والظهور للآخرين والحفاظ على مساحة أمان."}},{"id":1306,"tracks":["motorcycle"],"cat":"motorcycle","source":"principle","q":{"en":"What should a rider do before carrying a passenger?","ar":"ماذا يجب أن يفعل راكب الدراجة قبل نقل راكب إضافي؟"},"a":[{"en":"Make sure the motorcycle, equipment and rider are suitable and account for extra weight","ar":"التأكد من ملاءمة الدراجة والتجهيزات والراكب وأخذ الوزن الإضافي بالحسبان"},{"en":"Remove mirrors","ar":"انزع المرايا"},{"en":"Lower tyre pressure arbitrarily","ar":"خفف ضغط الإطارات عشوائياً"},{"en":"Ignore braking changes","ar":"تجاهل تغير الفرملة"}],"correct":0,"exp":{"en":"A passenger changes weight distribution, braking and handling.","ar":"الراكب الإضافي يغير توزيع الوزن والفرملة والتحكم."}},{"id":1307,"tracks":["motorcycle"],"cat":"motorcycle","source":"principle","q":{"en":"Why should a rider leave extra distance behind a bus or truck?","ar":"لماذا يجب على راكب الدراجة ترك مسافة إضافية خلف باص أو شاحنة؟"},"a":[{"en":"To improve forward visibility and reaction time","ar":"لتحسين الرؤية للأمام ووقت الاستجابة"},{"en":"To stay hidden","ar":"للبقاء مخفياً"},{"en":"To reduce helmet use","ar":"لتقليل استعمال الخوذة"},{"en":"To avoid signals","ar":"لتجنب الإشارات"}],"correct":0,"exp":{"en":"Large vehicles can block the rider’s view of hazards and traffic changes.","ar":"المركبات الكبيرة قد تحجب رؤية الراكب للمخاطر وتغيرات السير."}},{"id":1308,"tracks":["motorcycle"],"cat":"motorcycle","source":"principle","q":{"en":"When crossing a painted line or metal cover in the wet, what is safer?","ar":"عند عبور خط مطلي أو غطاء معدني مبلل، ما الأكثر أماناً؟"},"a":[{"en":"Cross smoothly with minimal sudden lean, braking or acceleration","ar":"اعبر بسلاسة مع أقل قدر من الميل أو الفرملة أو التسارع المفاجئ"},{"en":"Brake hard on it","ar":"افرمل بقوة فوقه"},{"en":"Turn sharply","ar":"انعطف بحدة"},{"en":"Accelerate suddenly","ar":"تسارع فجأة"}],"correct":0,"exp":{"en":"Paint and metal can offer less grip when wet.","ar":"الطلاء والمعدن قد يوفران تماسكاً أقل عندما يكونان مبللين."}},{"id":1309,"tracks":["motorcycle"],"cat":"motorcycle","source":"principle","q":{"en":"What should you do if strong crosswind moves the motorcycle?","ar":"ماذا تفعل إذا دفعت رياح جانبية قوية الدراجة؟"},"a":[{"en":"Reduce speed, keep a stable grip and allow safe lateral space","ar":"خفف السرعة وثبت قبضتك واترك مساحة جانبية آمنة"},{"en":"Accelerate sharply","ar":"تسارع بقوة"},{"en":"Ride very close to trucks","ar":"قد قريباً جداً من الشاحنات"},{"en":"Close your eyes","ar":"أغمض عينيك"}],"correct":0,"exp":{"en":"Crosswind effects are easier to manage with speed reduction and space.","ar":"تأثير الرياح الجانبية أسهل للتحكم مع سرعة أقل ومساحة أكبر."}},{"id":1310,"tracks":["motorcycle"],"cat":"moto_control","source":"principle","q":{"en":"During slow-speed motorcycle control, where should you look?","ar":"أثناء التحكم بالدراجة على سرعة بطيئة، أين يجب أن تنظر؟"},"a":[{"en":"Toward the intended path, not down at the front wheel","ar":"نحو المسار المقصود وليس إلى العجلة الأمامية"},{"en":"Only at the speedometer","ar":"إلى عداد السرعة فقط"},{"en":"At the road directly under the tyre","ar":"إلى الطريق مباشرة تحت الإطار"},{"en":"At your phone","ar":"إلى الهاتف"}],"correct":0,"exp":{"en":"Looking ahead supports balance and steering control.","ar":"النظر إلى الأمام يساعد على التوازن والتحكم بالتوجيه."}},{"id":1311,"tracks":["motorcycle"],"cat":"motorcycle","source":"principle","q":{"en":"Why is protective clothing useful even at low speed?","ar":"لماذا الملابس الواقية مفيدة حتى عند السرعات المنخفضة؟"},"a":[{"en":"A fall can still cause abrasion and impact injuries","ar":"السقوط قد يسبب احتكاكات وإصابات حتى بسرعة منخفضة"},{"en":"It increases engine power","ar":"تزيد قوة المحرك"},{"en":"It removes the need for a helmet","ar":"تلغي الحاجة للخوذة"},{"en":"It guarantees no injury","ar":"تضمن عدم الإصابة"}],"correct":0,"exp":{"en":"Protective gear reduces exposure to abrasion and impact; it does not make riding risk-free.","ar":"معدات الحماية تقلل التعرض للاحتكاك والصدمات لكنها لا تلغي المخاطر."}},{"id":1312,"tracks":["motorcycle"],"cat":"motorcycle","source":"principle","q":{"en":"At a junction, why should a motorcyclist be cautious even with priority?","ar":"عند تقاطع، لماذا يجب على راكب الدراجة الحذر حتى لو كانت له الأفضلية؟"},"a":[{"en":"Another driver may fail to notice the motorcycle or misjudge its speed","ar":"قد لا يلاحظ سائق آخر الدراجة أو يسيء تقدير سرعتها"},{"en":"Priority makes collision impossible","ar":"الأفضلية تجعل الحادث مستحيلاً"},{"en":"Motorcycles are always heard","ar":"الدراجات مسموعة دائماً"},{"en":"Signals stop all traffic automatically","ar":"الإشارات توقف الجميع تلقائياً"}],"correct":0,"exp":{"en":"Legal priority does not guarantee that others have seen you.","ar":"الأفضلية القانونية لا تضمن أن الآخرين قد رأوك."}},{"id":1313,"tracks":["motorcycle"],"cat":"moto_control","source":"principle","q":{"en":"If the motorcycle starts to wobble, what should you avoid?","ar":"إذا بدأت الدراجة بالاهتزاز، ماذا يجب أن تتجنب؟"},"a":[{"en":"Abrupt steering or panic inputs","ar":"التوجيه المفاجئ أو ردود الفعل العصبية"},{"en":"Looking ahead","ar":"النظر إلى الأمام"},{"en":"Maintaining controlled posture","ar":"الحفاظ على وضعية مضبوطة"},{"en":"Reducing risk gradually","ar":"تخفيف الخطر تدريجياً"}],"correct":0,"exp":{"en":"Abrupt inputs can worsen instability.","ar":"الحركات المفاجئة قد تزيد عدم الثبات."}},{"id":1314,"tracks":["motorcycle"],"cat":"motorcycle","source":"principle","q":{"en":"What is the purpose of a pre-ride brake check?","ar":"ما الهدف من فحص الفرامل قبل الانطلاق بالدراجة؟"},"a":[{"en":"Confirm the controls operate normally before entering traffic","ar":"التأكد من أن الفرامل تعمل بشكل طبيعي قبل دخول السير"},{"en":"Warm the horn","ar":"تسخين الزمور"},{"en":"Change tyre colour","ar":"تغيير لون الإطار"},{"en":"Increase fuel use","ar":"زيادة استهلاك الوقود"}],"correct":0,"exp":{"en":"A simple check can reveal a fault before it becomes an emergency.","ar":"الفحص البسيط قد يكشف عطلًا قبل أن يتحول إلى طارئ."}},{"id":1315,"tracks":["motorcycle"],"cat":"motorcycle","source":"principle","q":{"en":"Why should a rider avoid weaving between vehicles?","ar":"لماذا يجب على راكب الدراجة تجنب التعرج بين المركبات؟"},"a":[{"en":"It increases conflict points and reduces predictable space","ar":"يزيد نقاط التعارض ويقلل المساحة المتوقعة"},{"en":"It guarantees faster travel","ar":"يضمن الوصول أسرع"},{"en":"It improves visibility to everyone","ar":"يحسن الرؤية للجميع"},{"en":"It removes blind spots","ar":"يلغي النقاط العمياء"}],"correct":0,"exp":{"en":"Predictable positioning gives both the rider and other drivers more time to react.","ar":"التموضع المتوقع يمنح الراكب والسائقين الآخرين وقتاً أكبر للاستجابة."}},{"id":1316,"tracks":["motorcycle"],"cat":"motorcycle","source":"principle","q":{"en":"Before overtaking on a motorcycle, what must you confirm?","ar":"قبل التجاوز بالدراجة، ماذا يجب أن تتأكد؟"},"a":[{"en":"It is legal, visible, clear and can be completed safely","ar":"أنه قانوني والرؤية واضحة والمسار خالٍ ويمكن إتمامه بأمان"},{"en":"Only that the engine is loud","ar":"فقط أن صوت المحرك مرتفع"},{"en":"Only that the vehicle ahead is slow","ar":"فقط أن المركبة أمامك بطيئة"},{"en":"That you can pass on any side","ar":"أنك تستطيع التجاوز من أي جهة"}],"correct":0,"exp":{"en":"Overtaking needs a legal and safe gap with adequate visibility.","ar":"التجاوز يحتاج إلى فجوة قانونية وآمنة مع رؤية كافية."}},{"id":1317,"tracks":["motorcycle"],"cat":"motorcycle","source":"principle","q":{"en":"How does carrying luggage high on a motorcycle affect handling?","ar":"كيف تؤثر الأمتعة الموضوعة عالياً على الدراجة على التحكم؟"},"a":[{"en":"It can raise the centre of gravity and reduce stability","ar":"قد ترفع مركز الثقل وتقلل الثبات"},{"en":"It always improves stability","ar":"تحسن الثبات دائماً"},{"en":"It has no effect","ar":"لا تأثير لها"},{"en":"It makes braking unnecessary","ar":"تلغي الحاجة للفرملة"}],"correct":0,"exp":{"en":"Load position changes balance and steering feel.","ar":"موضع الحمولة يغير التوازن وإحساس التوجيه."}},{"id":1318,"tracks":["motorcycle"],"cat":"motorcycle","source":"principle","q":{"en":"Why should a rider be cautious next to parked cars?","ar":"لماذا يجب على راكب الدراجة الحذر بجانب السيارات المتوقفة؟"},"a":[{"en":"A door may open or a person may step out","ar":"قد يفتح باب أو يخرج شخص"},{"en":"Parked cars always move backwards","ar":"السيارات المتوقفة تتحرك دائماً للخلف"},{"en":"There are no pedestrians there","ar":"لا يوجد مشاة هناك"},{"en":"The rider has automatic priority","ar":"لراكب الدراجة أولوية تلقائية"}],"correct":0,"exp":{"en":"Door openings and pedestrian movement are common hazards beside parked vehicles.","ar":"فتح الأبواب وحركة المشاة من المخاطر الشائعة بجانب السيارات المتوقفة."}},{"id":1319,"tracks":["motorcycle"],"cat":"motorcycle","source":"principle","q":{"en":"What should happen to following distance at night on a motorcycle?","ar":"ماذا يجب أن يحدث لمسافة الأمان ليلاً على الدراجة؟"},"a":[{"en":"Allow more space when visibility is reduced","ar":"اترك مساحة أكبر عندما تقل الرؤية"},{"en":"Reduce it to see the vehicle ahead","ar":"قللها لرؤية المركبة أمامك"},{"en":"Keep the front wheel near the bumper ahead","ar":"قرّب العجلة من السيارة أمامك"},{"en":"Distance no longer matters","ar":"المسافة لا تعود مهمة"}],"correct":0,"exp":{"en":"Reduced visibility means you need more time and space to detect and react to hazards.","ar":"الرؤية المنخفضة تعني أنك تحتاج وقتاً ومسافة أكبر لاكتشاف المخاطر والاستجابة لها."}},{"id":1320,"tracks":["motorcycle"],"cat":"motorcycle","source":"principle","q":{"en":"If an insect or debris hits your visor, what is the safest reaction?","ar":"إذا اصطدمت حشرة أو جسم بواقي الوجه، ما التصرف الأكثر أماناً؟"},"a":[{"en":"Keep control, reduce speed safely and stop if visibility is affected","ar":"حافظ على التحكم وخفف السرعة بأمان وتوقف إذا تأثرت الرؤية"},{"en":"Remove both hands from the handlebars","ar":"ارفع كلتا يديك عن المقود"},{"en":"Close your eyes and continue","ar":"أغمض عينيك وتابع"},{"en":"Accelerate","ar":"تسارع"}],"correct":0,"exp":{"en":"Maintain control first; deal with the visibility issue from a safe position.","ar":"حافظ على التحكم أولاً وعالج مشكلة الرؤية من مكان آمن."}}],"signs":[{"key":"lb_0001","id":1,"file":"data:image/webp;base64,UklGRroKAABXRUJQVlA4IK4KAACQLwCdASpUAFQAPiUOhkIhheLTvAYAkS2AGhEL76rzP8d/y1+YGlfxT7V/tx/mOmvLj1l/l/7H+539896P+K/ID5HeYB+jf+H/rH7kf2ruMeYb9Xv+V/lvd0/vH+O9i3+M9QD+z/4PrFfQH/Yn0uv3K+DH9mf3D+BX9c/+jnKP877MP7D+O/Rg+yWcd+x/4D+r/uJ66f1XwN4AX47/If7x+Uv5c8g7Wz0AvYn65/n/zM5m/l285z8vea1oCfxr+o/8f+0+6n let practiceTimerHandle=null;
function startPracticeSession(){
 const pool=currentPool();
 const count=Math.min(parseInt(document.getElementById("practiceCount")?.value||"20",10),pool.length);
 const duration=parseInt(document.getElementById("practiceTimer")?.value||"900",10);
 state.practiceSession={qs:shuffled(pool).slice(0,count),answers:Array(count).fill(null),i:0,start:Date.now(),duration,finished:false,review:false,reviewIndex:0};
 state.route="practice";
 startPracticeClock();
 render();
}
function startPracticeClock(){
 if(practiceTimerHandle){clearInterval(practiceTimerHandle);practiceTimerHandle=null}
 if(!state.practiceSession||!state.practiceSession.duration||state.practiceSession.finished)return;
 practiceTimerHandle=setInterval(()=>{
   const s=state.practiceSession;if(!s||s.finished){clearInterval(practiceTimerHandle);practiceTimerHandle=null;return}
   const left=s.duration-Math.floor((Date.now()-s.start)/1000);
   const el=document.getElementById("practiceClock");
   if(el)el.textContent=formatTime(Math.max(0,left));
   if(left<=0){clearInterval(practiceTimerHandle);practiceTimerHandle=null;finishPracticeSession(true)}
 },1000);
}
function formatTime(sec){const m=Math.floor(sec/60),s=sec%60;return `${String(m).padStart(2,"0")}:${String(s).padStart(2,"0")}`}
function practiceSessionView(){
 const s=state.practiceSession;
 if(!s)return practice();
 if(s.finished)return practiceSessionResult();
 const q=s.qs[s.i],cat=D.categories[q.cat];
 const remaining=s.duration?Math.max(0,s.duration-Math.floor((Date.now()-s.start)/1000)):0;
 setTimeout(startPracticeClock,0);
 return `<div class="session-top"><button class="ghost-btn" onclick="cancelPracticeSession()">✕</button><div><b>${state.lang==="ar"?"جلسة تدريب":"Practice Session"}</b><small>${s.i+1}/${s.qs.length}</small></div><div class="practice-clock" id="practiceClock">${s.duration?formatTime(remaining):(state.lang==="ar"?"بدون مؤقّت":"Untimed")}</div></div>
 <div class="card"><div class="badge-row"><span class="chip">${cat.icon} ${label(cat)}</span>${trackPill()}</div><div class="quiz-q">${label(q.q)}</div>
 <div class="answers session-answers">${q.a.map((a,i)=>`<button class="answer ${s.answers[s.i]===i?"selected":""}" onclick="choosePracticeAnswer(${i})">${String.fromCharCode(65+i)}. ${label(a)}</button>`).join("")}</div></div>
 <div class="session-nav"><button class="secondary-btn" onclick="practicePrev()" ${s.i===0?"disabled":""}>${state.lang==="ar"?"السابق":"Previous"}</button><button class="ghost-btn" onclick="practiceSkip()">${state.lang==="ar"?"تجاوز":"Skip"}</button>${s.i===s.qs.length-1?`<button class="primary-btn" onclick="finishPracticeSession(false)">${state.lang==="ar"?"إنهاء الجلسة":"Finish session"}</button>`:`<button class="primary-btn" onclick="practiceNext()">${state.lang==="ar"?"التالي":"Next"}</button>`}</div>
 <div class="card answer-map">${s.answers.map((a,i)=>`<button class="${i===s.i?"current":""} ${a!==null?"answered":""}" onclick="state.practiceSession.i=${i};render()">${i+1}</button>`).join("")}</div>`;
}
function choosePracticeAnswer(i){state.practiceSession.answers[state.practiceSession.i]=i;render()}
function practicePrev(){if(state.practiceSession.i>0){state.practiceSession.i--;render()}}
function practiceNext(){if(state.practiceSession.i<state.practiceSession.qs.length-1){state.practiceSession.i++;render()}}
function practiceSkip(){practiceNext()}
function cancelPracticeSession(){if(confirm(state.lang==="ar"?"هل تريد إنهاء جلسة التدريب الحالية؟":"Leave the current practice session?")){if(practiceTimerHandle)clearInterval(practiceTimerHandle);practiceTimerHandle=null;state.practiceSession=null;render()}}
function finishPracticeSession(timeout){
 const s=state.practiceSession;if(!s||s.finished)return;
 if(practiceTimerHandle)clearInterval(practiceTimerHandle);practiceTimerHandle=null;
 let correct=0,cat={};
 s.qs.forEach((q,i)=>{const ok=s.answers[i]===q.correct;if(ok)correct++;if(!cat[q.cat])cat[q.cat]={a:0,c:0};cat[q.cat].a++;if(ok)cat[q.cat].c++;const mk=keyForMistake(q.id);if(ok)delete state.mistakes[mk];else state.mistakes[mk]=(state.mistakes[mk]||0)+1});
 s.correct=correct;s.finished=true;s.timeout=!!timeout;s.cat=cat;
 state.history.push({date:new Date().toISOString(),track:state.track,total:s.qs.length,correct,cat,mock:false,session:true});
 save();render();
}
function practiceSessionResult(){
 const s=state.practiceSession,p=pct(s.correct/s.qs.length*100),answered=s.answers.filter(x=>x!==null).length;
 if(s.review)return practiceReviewView();
 return `<div class="card center"><div style="font-size:2.2rem">📊</div><h2>${state.lang==="ar"?"نتيجة جلسة التدريب":"Practice Session Result"}</h2><div class="score">${p}%</div><p>${s.correct}/${s.qs.length} · ${state.lang==="ar"?"تمت الإجابة عن":"answered"} ${answered}/${s.qs.length}</p>${s.timeout?`<div class="alert">${state.lang==="ar"?"انتهى الوقت وتم إنهاء الجلسة تلقائياً.":"Time expired and the session was submitted automatically."}</div>`:""}<br><button class="primary-btn" onclick="state.practiceSession.review=true;state.practiceSession.reviewIndex=0;render()">${state.lang==="ar"?"مراجعة الإجابات":"Review answers"}</button> <button class="secondary-btn" onclick="state.practiceSession=null;render()">${state.lang==="ar"?"جلسة جديدة":"New session"}</button></div><div class="card">${Object.entries(s.cat).map(([k,v])=>metric(label(D.categories[k]),v.c/v.a*100)).join("")}</div>`;
}
function practiceReviewView(){
 const s=state.practiceSession,i=s.reviewIndex,q=s.qs[i],given=s.answers[i],ok=given===q.correct;
 return `<div class="row-between"><button class="ghost-btn" onclick="state.practiceSession.review=false;render()">←</button><b>${state.lang==="ar"?"مراجعة الإجابات":"Answer Review"} ${i+1}/${s.qs.length}</b><span class="chip ${ok?"good":"bad"}">${ok?"✓":"✕"}</span></div>
 <div class="card"><div class="quiz-q">${label(q.q)}</div>${q.a.map((a,j)=>`<div class="review-answer ${j===q.correct?"right":""} ${j===given&&j!==q.correct?"chosen-wrong":""}">${String.fromCharCode(65+j)}. ${label(a)} ${j===q.correct?"✓":j===given?"←":""}</div>`).join("")}<div class="feedback"><b>${tx("why")}:</b> ${label(q.exp)}</div></div>
 <div class="session-nav"><button class="secondary-btn" onclick="if(state.practiceSession.reviewIndex>0){state.practiceSession.reviewIndex--;render()}" ${i===0?"disabled":""}>${state.lang==="ar"?"السابق":"Previous"}</button><button class="primary-btn" onclick="if(state.practiceSession.reviewIndex<state.practiceSession.qs.length-1){state.practiceSession.reviewIndex++;render()}" ${i===s.qs.length-1?"disabled":""}>${state.lang==="ar"?"التالي":"Next"}</button></div>`;
}
function shuffled(a){return [...a].sort(()=>Math.random()-.5)}
function startQuiz(cat,count,mock){let pool=currentPool();if(cat!=="all")pool=pool.filter(q=>q.cat===cat);state.quiz={qs:shuffled(pool).slice(0,Math.min(count,pool.length)),i:0,correct:0,cat:{},mock,locked:false};state.route="practice";render()}
function startMistakes(){let ids=Object.keys(state.mistakes).filter(k=>k.startsWith(state.track+":")).map(k=>Number(k.split(":")[1]));let pool=currentPool().filter(q=>ids.includes(q.id));if(!pool.length){alert(tx("noMistakes"));return}state.quiz={qs:shuffled(pool),i:0,correct:0,cat:{},mock:false,locked:false};render()}
function quizView(){const z=state.quiz;if(z.done)return results();const q=z.qs[z.i],c=D.categories[q.cat];return `<div class="quiz-head"><span class="chip">${c.icon} ${label(c)}</span><b>${tx("question")} ${z.i+1}/${z.qs.length}</b></div><div class="card"><div class="badge-row">${sourceBadge(q.source)}${trackPill()}</div><div class="quiz-q">${label(q.q)}</div><div class="answers">${q.a.map((a,i)=>`<button class="answer" onclick="answerQ(${i})">${String.fromCharCode(65+i)}. ${label(a)}</button>`).join("")}</div><div id="feedback"></div></div>`}
function answerQ(i){const z=state.quiz;if(z.locked)return;z.locked=true;const q=z.qs[z.i],ok=i===q.correct;if(ok)z.correct++;if(!z.cat[q.cat])z.cat[q.cat]={a:0,c:0};z.cat[q.cat].a++;if(ok)z.cat[q.cat].c++;const mk=keyForMistake(q.id);if(ok)delete state.mistakes[mk];else state.mistakes[mk]=(state.mistakes[mk]||0)+1;save();document.querySelectorAll(".answer").forEach((b,j)=>{if(j===q.correct)b.classList.add("correct");else if(j===i&&!ok)b.classList.add("wrong");b.disabled=true});document.getElementById("feedback").innerHTML=`<div class="feedback"><b>${ok?"✅ "+tx("correct"):"❌ "+tx("incorrect")}</b><br><small><b>${tx("why")}</b> ${label(q.exp)}</small><br><br><button class="primary-btn" onclick="nextQ()">${z.i===z.qs.length-1?tx("finish"):tx("next")}</button></div>`}
function nextQ(){const z=state.quiz;z.i++;z.locked=false;if(z.i>=z.qs.length){z.done=true;state.history.push({date:new Date().toISOString(),track:state.track,total:z.qs.length,correct:z.correct,cat:z.cat,mock:z.mock});save()}render()}
function results(){const z=state.quiz,p=pct(z.correct/z.qs.length*100);if(z.combo){return `<div class="card center"><div style="font-size:2.2rem">📝</div><h2>${state.lang==="ar"?"انتهى القسم النظري":"Theory section complete"}</h2><div class="score">${z.correct}/15</div><p>${state.lang==="ar"?"الآن انتقل إلى 15 إشارة لإكمال التحدّي.":"Now continue with 15 signs to complete the challenge."}</p><button class="primary-btn" onclick="continueFinalSigns()">🚦 ${state.lang==="ar"?"الانتقال إلى الإشارات":"Continue to signs"}</button></div>`}return `<div class="card center"><div style="font-size:2.2rem">🏁</div><div>${trackPill()}</div><h2>${tx("score")}</h2><div class="score">${p}%</div><p>${z.correct}/${z.qs.length}</p><button class="primary-btn" onclick="state.quiz=null;render()">${tx("again")}</button> <button class="secondary-btn" onclick="state.quiz=null;navigate('progress')">${tx("navProgress")}</button></div><div class="card">${Object.entries(z.cat).map(([k,v])=>metric(label(D.categories[k]),v.c/v.a*100)).join("")}</div>`}
function metric(n,p){return `<div class="metric"><div style="flex:1"><div class="row-between"><b>${n}</b><small>${pct(p)}%</small></div><div class="progressbar"><span style="width:${pct(p)}%"></span></div></div></div>`}
function progress(){const s=stats();return `<div class="section-title"><h2>📊 ${tx("progressTitle")}</h2></div><div class="card"><div class="row-between">${trackPill()}<button class="ghost-btn" onclick="navigate('profile')">${tx("switchTrack")}</button></div></div><div class="card"><div class="kpi-row"><div class="kpi"><strong>${state.history.filter(h=>h.track===state.track).length}</strong><small>${tx("attempts")}</small></div><div class="kpi"><strong>${pct(s.accuracy)}%</strong><small>${tx("accuracy")}</small></div><div class="kpi"><strong>${mistakeCount()}</strong><small>${tx("mistakeCount")}</small></div></div></div><div class="card"><h3>${tx("ready")}: ${pct(s.readiness)}%</h3>${Object.entries(s.cat).map(([k,v])=>v.a?metric(label(D.categories[k]),v.c/v.a*100):"").join("")||`<p class="note">${tx("emptyHistory")}</p>`}</div><div class="card"><h3>❌ ${tx("mistakes")}</h3>${mistakeList()}</div>`}
function mistakeList(){let keys=Object.keys(state.mistakes).filter(k=>k.startsWith(state.track+":"));if(!keys.length)return `<p class="note">${tx("noMistakes")}</p>`;return keys.map(k=>{let id=Number(k.split(":")[1]),q=D.questions.find(x=>x.id===id);return q?`<div class="list-item"><div class="list-icon">❌</div><div><h4>${label(q.q)}</h4><p>${label(D.categories[q.cat])} · ${state.mistakes[k]}×</p></div></div>`:""}).join("")}
function trackSelector(){return `<div class="track-picker">${Object.entries(D.tracks).map(([k,v])=>`<button class="track-card ${state.track===k?"active":""}" onclick="setTrack('${k}')"><div class="track-icon">${v.icon}</div><div><h4>${state.lang==="ar"?v.ar:v.en}</h4><p>${label(v.desc)}</p></div><div class="track-check">${state.track===k?"✓":""}</div></button>`).join("")}</div>`}

function drawCar(mode){const c=document.getElementById("simCanvas");if(!c)return;const x=c.getContext("2d"),s=mode==="garage"?garageCar:sim;x.clearRect(0,0,360,480);x.fillStyle="#596970";x.fillRect(0,0,360,480);x.strokeStyle="white";x.lineWidth=3;if(mode==="parallel"){x.setLineDash([14,14]);x.beginPath();x.moveTo(120,0);x.lineTo(120,480);x.stroke();x.setLineDash([]);x.fillStyle="#242d32";x.fillRect(220,35,78,135);x.fillRect(220,305,78,135);x.strokeStyle="#72db9a";x.lineWidth=5;x.strokeRect(210,178,98,118)}else{x.strokeStyle="#72db9a";x.lineWidth=5;x.strokeRect(105,40,150,165);x.strokeStyle="white";x.lineWidth=3;x.beginPath();x.moveTo(0,255);x.lineTo(360,255);x.stroke()}x.save();x.translate(s.x,s.y);x.rotate(s.a);x.fillStyle="#38bdf8";x.fillRect(-26,-48,52,96);x.fillStyle="#dbeafe";x.fillRect(-19,-27,38,39);x.restore()}

const sequences={hill:{ar:["ثبّت السيارة وحافظ على السيطرة.","راقب المرايا وجهّز السيارة للانطلاق.","أعطِ الإشارة عند الحاجة وافحص النقطة العمياء.","حرّر التثبيت تدريجياً مع قوة مناسبة.","انطلق بسلاسة من دون رجوع غير مسيطر عليه."],en:["Hold the vehicle securely.","Check mirrors and prepare to move.","Signal if needed and check the blind spot.","Release the holding force progressively with suitable power.","Move away smoothly without uncontrolled rollback."]},passenger:{ar:["اختر موقع توقف آمن وقانوني.","أعطِ الإشارة مبكراً وخفف بسلاسة.","راقب المرايا ومحيط المركبة.","تأكد من صعود أو نزول الركاب بأمان.","قبل الانطلاق: أبواب، مرايا، نقطة عمياء، ثم تحرك بسلاسة."],en:["Choose a safe legal stopping position.","Signal early and slow smoothly.","Observe mirrors and surroundings.","Make sure passengers board or leave safely.","Before moving: doors, mirrors, blind spot, then move smoothly."]},preride:{ar:["ثبّت الخوذة الواقية بشكل صحيح.","افحص الإطارات.","اختبر الفرامل وأدوات التحكم.","تأكد من الأضواء والإشارات.","راقب أي تسرب ظاهر وجهّز وضعية الانطلاق."],en:["Secure the protective helmet correctly.","Check the tyres.","Test brakes and controls.","Check lights and indicators.","Look for visible leaks and prepare your riding position."]},motolane:{ar:["مرآة: اعرف ما خلفك.","إشارة: أخبر الآخرين بنيتك.","فحص فوق الكتف للنقطة العمياء.","غيّر المسار تدريجياً مع الحفاظ على التوازن.","ألغِ الإشارة واستمر بالمراقبة."],en:["Mirror: know what is behind you.","Signal your intention.","Shoulder/blind-spot check.","Change lane progressively while balanced.","Cancel the signal and keep observing."]}};

function normAngle(a){while(a>Math.PI)a-=Math.PI*2;while(a<-Math.PI)a+=Math.PI*2;return a}
function turnDegrees(){return Math.min(180,Math.round(Math.abs(normAngle(circuit.a-circuit.stageEntryAngle))*180/Math.PI))}
function stageConditions(){
 const st=circuit.stage;
 if(st===0)return [{ok:circuit.y<660&&circuit.x>150&&circuit.x<275,ar:"دخلت المسار",en:"Entered the lane"}];
 if(st===1)return [{ok:inRect(145,600,275,650),ar:"داخل منطقة التوقف",en:"Inside stop zone"},{ok:nearlyStopped(),ar:"السيارة متوقفة",en:"Vehicle stopped"}];
 if(st===2)return [{ok:inRect(310,495,382,592),ar:"داخل موقف الركن",en:"Inside parking bay"},{ok:circuit.lastMotionDir<0,ar:"تم الركن بالرجوع للخلف",en:"Reversed into bay"},{ok:nearlyStopped(),ar:"السيارة متوقفة",en:"Vehicle stopped"}];
 if(st===3){const deg=turnDegrees();return [{ok:inRect(100,65,320,230),ar:"داخل منطقة الدوران",en:"Inside turn area"},{ok:deg>=145,ar:`تم تغيير الاتجاه ${deg}° / 180°`,en:`Turned ${deg}° / 180°`},{ok:nearlyStopped(),ar:"أوقف السيارة",en:"Stop the vehicle"}];}
 if(st===4)return [{ok:circuit.y<270&&circuit.x>95&&circuit.x<255,ar:"تم عبور المسار المتعرج",en:"Zigzag section completed"}];
 if(st===5)return [{ok:inRect(305,285,390,420),ar:"السيارة داخل الموقف",en:"Car inside bay"},{ok:nearlyStopped(),ar:"السيارة متوقفة",en:"Vehicle stopped"},{ok:Math.abs(Math.sin(circuit.a))<.5,ar:"السيارة بمحاذاة الموقف",en:"Car aligned with bay"}];
 if(st===6)return [{ok:inRect(40,645,130,735),ar:"وصلت إلى منطقة النهاية",en:"Reached finish zone"},{ok:nearlyStopped(),ar:"السيارة متوقفة",en:"Vehicle stopped"}];
 return [];
}

function bindCircuitControls(){
 document.querySelectorAll('[data-circuit-input]').forEach(btn=>{
   const key=btn.dataset.circuitInput;
   const down=e=>{e.preventDefault();circuitInput[key]=true;btn.classList.add('pressed');try{btn.setPointerCapture(e.pointerId)}catch(_){}};
   const up=e=>{e.preventDefault();circuitInput[key]=false;btn.classList.remove('pressed')};
   btn.onpointerdown=down;btn.onpointerup=up;btn.onpointercancel=up;btn.onlostpointercapture=up;
 });

 const pad=document.getElementById("steerPad"),knob=document.getElementById("steerKnob");
 if(pad&&knob){
   let active=false,pid=null;
   const update=e=>{
     const r=pad.getBoundingClientRect();
     const cx=r.left+r.width/2;
     const dx=e.clientX-cx;
     const max=r.width*.34;
     const axis=Math.max(-1,Math.min(1,dx/max));
     circuit.touchSteer=axis;
     knob.style.transform=`translate(calc(-50% + ${axis*max*.72}px),-50%)`;
     knob.classList.add("active");
   };
   const release=e=>{
     if(pid!==null&&e.pointerId!==undefined&&e.pointerId!==pid)return;
     active=false;pid=null;circuit.touchSteer=0;
     knob.style.transform="translate(-50%,-50%)";
     knob.classList.remove("active");
   };
   pad.onpointerdown=e=>{e.preventDefault();active=true;pid=e.pointerId;try{pad.setPointerCapture(pid)}catch(_){};update(e)};
   pad.onpointermove=e=>{if(active)update(e)};
   pad.onpointerup=release;pad.onpointercancel=release;pad.onlostpointercapture=release;
 }

 if(!window._r2dSmoothKeysV83){
   window._r2dSmoothKeysV83=true;
   window.addEventListener('keydown',e=>{
     if(state.route!=="circuit")return;
     if(["ArrowUp","ArrowDown","ArrowLeft","ArrowRight"," "].includes(e.key))e.preventDefault();
     if(e.key==="ArrowUp")circuitInput.forward=true;
     if(e.key==="ArrowDown")circuitInput.brakeReverse=true;
     if(e.key==="ArrowLeft")circuitInput.left=true;
     if(e.key==="ArrowRight")circuitInput.right=true;
     if(e.key===" ")circuitInput.brake=true;
   });
   window.addEventListener('keyup',e=>{
     if(e.key==="ArrowUp")circuitInput.forward=false;
     if(e.key==="ArrowDown")circuitInput.brakeReverse=false;
     if(e.key==="ArrowLeft")circuitInput.left=false;
     if(e.key==="ArrowRight")circuitInput.right=false;
     if(e.key===" ")circuitInput.brake=false;
   });
   window.addEventListener('blur',clearCircuitInput);
 }
}

function clearCircuitInput(){Object.keys(circuitInput).forEach(k=>circuitInput[k]=false);if(circuit)circuit.touchSteer=0}
function toggleCircuitSignal(side){circuit.signal=circuit.signal===side?"none":side;drawCircuit()}
function showGameToast(msg){

function startCircuitEngine(){
 stopCircuitEngine();circuitLastFrame=performance.now();
 const tick=ts=>{
   if(state.route!=="circuit"){stopCircuitEngine();return}
   const dt=Math.min(.035,Math.max(.001,(ts-circuitLastFrame)/1000));circuitLastFrame=ts;
   updateCircuitPhysics(dt);drawCircuit();updateCircuitHud();
   circuitRaf=requestAnimationFrame(tick);
 };
 circuitRaf=requestAnimationFrame(tick);
}
function stopCircuitEngine(){if(circuitRaf){cancelAnimationFrame(circuitRaf);circuitRaf=0}clearCircuitInput()}
function approach(v,target,step){return v<target?Math.min(target,v+step):Math.max(target,v-step)}
function updateCircuitPhysics(dt){
 if(circuit.finished){circuit.speed=approach(circuit.speed,0,120*dt);return}
 const maxForward=61,maxReverse=-34,accel=48,reverseAccel=36,brakeForce=118,rolling=27;
 let target=0;

 if(circuitInput.forward)target=maxForward;

 // Mobile-game style brake/reverse: first brake, then reverse once nearly stopped.
 if(circuitInput.brakeReverse){
   if(circuit.speed>2.3){
     circuit.speed=approach(circuit.speed,0,brakeForce*dt);
     target=0;
   }else{
     target=maxReverse;
   }
 }

 // Keyboard/legacy reverse remains supported.
 if(circuitInput.reverse&&!circuitInput.forward)target=maxReverse;

 if(target>0){
   if(circuit.speed<0)circuit.speed=approach(circuit.speed,0,brakeForce*.85*dt);
   else circuit.speed=approach(circuit.speed,target,accel*dt);
   circuit.lastMotionDir=1;
 }else if(target<0){
   if(circuit.speed>0)circuit.speed=approach(circuit.speed,0,brakeForce*.9*dt);
   else circuit.speed=approach(circuit.speed,target,reverseAccel*dt);
   circuit.lastMotionDir=-1;
 }else if(!circuitInput.brakeReverse){
   circuit.speed=approach(circuit.speed,0,rolling*dt);
 }

 if(circuitInput.brake)circuit.speed=approach(circuit.speed,0,brakeForce*dt);

 const maxSteer=.72,steerSpeed=2.8,returnSpeed=2.15;
 let keyboardAxis=0;
 if(circuitInput.left&&!circuitInput.right)keyboardAxis=-1;
 if(circuitInput.right&&!circuitInput.left)keyboardAxis=1;
 const axis=Math.abs(circuit.touchSteer)>.03?circuit.touchSteer:keyboardAxis;
 const steerTarget=maxSteer*axis;
 circuit.steer=approach(circuit.steer,steerTarget,(Math.abs(axis)<.03?returnSpeed:steerSpeed)*dt);

 if(Math.abs(circuit.speed)>.25){
   const wheelBase=47;
   circuit.a+=(circuit.speed/wheelBase)*Math.tan(circuit.steer)*dt*.93;
   circuit.x+=Math.sin(circuit.a)*circuit.speed*dt;
   circuit.y-=Math.cos(circuit.a)*circuit.speed*dt;
 }

 const margin=20;let hitBoundary=false;
 if(circuit.x<margin){circuit.x=margin;hitBoundary=true}
 if(circuit.x>CIRCUIT_W-margin){circuit.x=CIRCUIT_W-margin;hitBoundary=true}
 if(circuit.y<margin){circuit.y=margin;hitBoundary=true}
 if(circuit.y>CIRCUIT_H-margin){circuit.y=CIRCUIT_H-margin;hitBoundary=true}
 if(hitBoundary){
   circuit.speed*=.12;
   const now=Date.now();
   if(now-circuit.lastBoundaryPenalty>1500){
     circuit.lastBoundaryPenalty=now;circuit.score=Math.max(0,circuit.score-4);
     circuit.errors.push(state.lang==="ar"?"تم تجاوز حدود ساحة التدريب.":"Training-area boundary crossed.");
     showGameToast(state.lang==="ar"?"خارج حدود المسار":"Outside training area");
   }
 }
 checkConeTouches();
}

function carCollisionRadius(){return 17}
function checkConeTouches(){
 circuitCones.forEach((p,i)=>{
   const d=Math.hypot(circuit.x-p[0],circuit.y-p[1]);
   if(d<carCollisionRadius()+7&&!circuit.touched.has(i)){
     circuit.touched.add(i);circuit.score=Math.max(0,circuit.score-8);circuit.speed*=.2;
     circuit.errors.push(state.lang==="ar"?`تمت ملامسة المخروط رقم ${i+1}.`:`Cone ${i+1} was touched.`);showGameToast(state.lang==="ar"?"لمست مخروطاً":"Cone touched");try{navigator.vibrate&&navigator.vibrate(70)}catch(_){}
   }
 });
}
function circuitGear(){if(Math.abs(circuit.speed)<1)return "N";return circuit.speed>0?"D":"R"}
function updateCircuitHud(){
 const speedEl=document.getElementById('hudSpeed'),gearEl=document.getElementById('hudGear'),errEl=document.getElementById('hudErrors'),scoreEl=document.getElementById('circuitScore');
 if(speedEl)speedEl.textContent=Math.round(Math.abs(circuit.speed)*.13);
 if(gearEl)gearEl.textContent=circuitGear();
 if(errEl)errEl.textContent=circuit.errors.length;
 if(scoreEl)scoreEl.textContent=circuit.score;
 const guide=document.getElementById('stageLiveGuide');if(guide)guide.innerHTML=stageGuideHtml();
 const check=document.getElementById('gameCheckBtn');if(check)check.classList.toggle('ready',stageReady());
 const list=document.getElementById('errorList');if(list)list.innerHTML=circuitErrorListHtml();const latest=document.getElementById('latestError');if(latest)latest.innerHTML=circuit.errors.length?`⚠ ${circuit.errors[circuit.errors.length-1]}`:(state.lang==="ar"?"✓ لا توجد أخطاء قيادة مسجّلة":"✓ No driving errors recorded");
}
function angleNear(target,tol=.65){let d=Math.atan2(Math.sin(circuit.a-target),Math.cos(circuit.a-target));return Math.abs(d)<tol}
function inRect(x1,y1,x2,y2){return circuit.x>=x1&&circuit.x<=x2&&circuit.y>=y1&&circuit.y<=y2}
function nearlyStopped(){return Math.abs(circuit.speed)<5}
function checkCircuitStage(){
 if(circuit.finished)return;
 const st=circuit.stage,elapsed=(Date.now()-circuit.stageStart)/1000,limit=circuitStages[st].limit;
 if(!stageReady()){
   const missing=stageConditions().filter(x=>!x.ok).map(x=>state.lang==="ar"?x.ar:x.en);
   showGameToast((state.lang==="ar"?"باقي: ":"Still needed: ")+missing[0]);
   // A failed CHECK is guidance, not a driving mistake in Practice mode.
   if(circuit.mode==="exam"&&circuit.lastFailedCheckStage!==st){
     circuit.lastFailedCheckStage=st;
     circuit.score=Math.max(0,circuit.score-2);
     circuit.errors.push(state.lang==="ar"?`المرحلة ${st+1}: تم طلب التحقق قبل استكمال الشروط.`:`Stage ${st+1}: check requested before requirements were complete.`);
   }
   updateCircuitHud();return;
 }
 if(limit&&elapsed>limit){
   circuit.score=Math.max(0,circuit.score-4);
   circuit.errors.push(state.lang==="ar"?`المرحلة ${st+1}: تم تجاوز الزمن التدريبي المقترح (${limit} ثانية).`:`Stage ${st+1}: suggested training time exceeded (${limit}s).`);
 }
 advanceCircuitStage(false);
}
function drawCircuit(){
 const c=document.getElementById("circuitCanvas");if(!c)return;
 const g=c.getContext("2d"),vw=c.width,vh=c.height;
 g.clearRect(0,0,vw,vh);

 // Sky/outer background under the game world.
 const bg=g.createLinearGradient(0,0,0,vh);bg.addColorStop(0,"#9fd4c1");bg.addColorStop(1,"#5d8d6a");g.fillStyle=bg;g.fillRect(0,0,vw,vh);

 // Follow camera: car is kept low in the viewport and the world rotates so "forward" stays upward.
 const zoom=2.02;
 const anchorX=vw*.5,anchorY=vh*.64;
 g.save();
 g.translate(anchorX,anchorY);
 g.rotate(-circuit.a);
 g.scale(zoom,zoom);
 g.translate(-circuit.x,-circuit.y);
 drawCircuitWorld(g);
 g.restore();

 // Player car is screen-fixed; world moves beneath it.
 drawPlayerCar(g,anchorX,anchorY,0,circuit.steer,circuit.signal);

 // Direction cue / horizon marker
 g.save();
 g.fillStyle="rgba(255,255,255,.7)";
 g.beginPath();g.moveTo(vw*.5,42);g.lineTo(vw*.5-9,62);g.lineTo(vw*.5+9,62);g.closePath();g.fill();
 g.restore();

 if(circuit.finished){
   g.fillStyle="rgba(5,40,34,.9)";
   roundedRect(g,vw*.12,vh*.34,vw*.76,vh*.2,28);g.fill();
   g.fillStyle="white";g.textAlign="center";
   g.font="700 34px sans-serif";g.fillText(state.lang==="ar"?"اكتملت المحاكاة":"Simulation Complete",vw/2,vh*.40);
   g.font="800 62px sans-serif";g.fillText(`${circuit.score}/100`,vw/2,vh*.48);
   g.textAlign="start";
 }
}

function drawCircuitWorld(g){
 // grass / lot
 let grass=g.createLinearGradient(0,0,CIRCUIT_W,CIRCUIT_H);grass.addColorStop(0,"#78a777");grass.addColorStop(1,"#5f8e67");g.fillStyle=grass;g.fillRect(0,0,CIRCUIT_W,CIRCUIT_H);

 // asphalt areas
 g.fillStyle="#4a565e";roundedRect(g,95,0,230,760,22);g.fill();roundedRect(g,280,270,125,340,18);g.fill();roundedRect(g,55,30,310,225,26);g.fill();

 // lane borders
 g.strokeStyle="#f8fafc";g.lineWidth=3;g.strokeRect(112,0,196,760);
 g.setLineDash([18,15]);g.strokeStyle="rgba(255,255,255,.65)";
 g.beginPath();g.moveTo(210,260);g.lineTo(210,760);g.stroke();g.setLineDash([]);

 // direction arrows
 drawRoadArrow(g,210,680,0);drawRoadArrow(g,210,545,0);drawRoadArrow(g,210,455,0);drawRoadArrow(g,210,260,0);

 // start + finish
 zone(g,165,660,90,74,"#25b66f",state.lang==="ar"?"انطلاق":"START");
 zone(g,36,650,90,78,"#e8a928",state.lang==="ar"?"نهاية":"FINISH");

 // crossing
 g.fillStyle="#fff";for(let i=0;i<7;i++)g.fillRect(118+i*27,574,16,10);g.fillRect(116,616,188,4);

 // angled parking
 g.strokeStyle="#fff";g.lineWidth=3;g.strokeRect(300,492,96,108);
 g.beginPath();g.moveTo(300,492);g.lineTo(358,600);g.stroke();
 g.beginPath();g.moveTo(338,492);g.lineTo(396,600);g.stroke();

 // parallel bay + parked cars
 g.strokeRect(300,282,96,142);
 drawParkedCar(g,348,463,0,"#d7dde2");drawParkedCar(g,348,252,0,"#9da7af");

 // U-turn arena
 g.strokeStyle="#fff";g.lineWidth=3;roundedRect(g,68,42,284,205,20);g.stroke();
 g.setLineDash([10,9]);g.beginPath();g.arc(210,145,88,0,Math.PI*2);g.stroke();g.setLineDash([]);
 if(circuit.stage===3){
   // target direction inside the turning area
   g.save();g.translate(210,145);g.rotate(circuit.stageEntryAngle+Math.PI);g.fillStyle="rgba(117,255,180,.92)";
   g.beginPath();g.moveTo(0,-48);g.lineTo(-15,-18);g.lineTo(-6,-18);g.lineTo(-6,25);g.lineTo(6,25);g.lineTo(6,-18);g.lineTo(15,-18);g.closePath();g.fill();g.restore();
 }

 // cones
 circuitCones.forEach((p,i)=>drawCone(g,p[0],p[1],circuit.touched.has(i)));

 // stage target
 if(circuit.mode==="practice"&&!circuit.finished){
   const hl=[[150,625,120,55],[142,596,136,58],[298,488,100,116],[75,50,270,190],[92,235,165,235],[297,280,102,148],[33,644,98,90]][circuit.stage];
   if(hl){
     const pulse=.58+.27*Math.sin(Date.now()/220);
     g.strokeStyle=`rgba(116,255,177,${pulse})`;g.lineWidth=6;
     roundedRect(g,...hl,12);g.stroke();
   }
 }
}

function roundedRect(ctx,x,y,w,h,r){ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath()}
function drawRoadArrow(g,x,y,a){g.save();g.translate(x,y);g.rotate(a);g.fillStyle="rgba(255,255,255,.35)";g.beginPath();g.moveTo(0,-18);g.lineTo(-10,-3);g.lineTo(-4,-3);g.lineTo(-4,15);g.lineTo(4,15);g.lineTo(4,-3);g.lineTo(10,-3);g.closePath();g.fill();g.restore()}
function drawParkedCar(g,x,y,a,color){g.save();g.translate(x,y);g.rotate(a);g.fillStyle="rgba(0,0,0,.2)";roundedRect(g,-17,-31,34,64,8);g.fill();g.translate(0,-2);g.fillStyle=color;roundedRect(g,-15,-29,30,58,8);g.fill();g.fillStyle="#b9d9ed";roundedRect(g,-11,-14,22,24,5);g.fill();g.restore()}
function drawPlayerCar(g,x,y,a,steer,signal){g.save();g.translate(x+3,y+5);g.rotate(a);g.fillStyle="rgba(0,0,0,.28)";roundedRect(g,-17,-31,34,64,9);g.fill();g.restore();g.save();g.translate(x,y);g.rotate(a);
 // wheels rear
 drawWheel(g,-15,18,0);drawWheel(g,15,18,0);drawWheel(g,-15,-20,steer);drawWheel(g,15,-20,steer);
 let body=g.createLinearGradient(-16,-30,16,30);body.addColorStop(0,"#38bdf8");body.addColorStop(1,"#0ea5e9");g.fillStyle=body;roundedRect(g,-15,-30,30,60,9);g.fill();g.strokeStyle="#e0f2fe";g.lineWidth=1.5;g.stroke();g.fillStyle="#dbeafe";roundedRect(g,-10,-15,20,24,5);g.fill();g.fillStyle="#0f172a";g.fillRect(-10,12,20,8);
 // front headlights / rear taillights make forward vs reverse visually obvious
 g.fillStyle="#fff7c2";g.fillRect(-11,-31,7,4);g.fillRect(4,-31,7,4);
 g.fillStyle="#ef4444";g.fillRect(-11,27,7,4);g.fillRect(4,27,7,4);
 g.fillStyle="#ffffff";g.beginPath();g.moveTo(0,-38);g.lineTo(-5,-31);g.lineTo(5,-31);g.closePath();g.fill();
 if(signal==="left"){g.fillStyle="#fbbf24";g.fillRect(-18,-23,4,8)}if(signal==="right"){g.fillStyle="#fbbf24";g.fillRect(14,-23,4,8)}g.restore()}
function drawWheel(g,x,y,steer){g.save();g.translate(x,y);g.rotate(steer);g.fillStyle="#111827";roundedRect(g,-3,-8,6,16,2);g.fill();g.restore()}
function zone(ctx,x,y,w,h,color,labelText){ctx.fillStyle=color+"44";ctx.fillRect(x,y,w,h);ctx.strokeStyle=color;ctx.lineWidth=3;ctx.strokeRect(x,y,w,h);ctx.fillStyle="white";ctx.font="bold 12px sans-serif";ctx.fillText(labelText,x+6,y+17)}
function drawCone(ctx,x,y,touched){ctx.save();ctx.translate(x,y);ctx.fillStyle=touched?"#ef4444":"#f97316";ctx.beginPath();ctx.moveTo(0,-9);ctx.lineTo(-7,8);ctx.lineTo(7,8);ctx.closePath();ctx.fill();ctx.fillStyle="#fff";ctx.fillRect(-5,0,10,3);ctx.fillStyle="#1f2937";ctx.fillRect(-9,8,18,3);ctx.restore()}

function toggleJourneyStep(id){const j=journeyStateForTrack();j[id]=!j[id];save();render()}
function journeyCompletedCount(){const j=journeyStateForTrack();return ["eligibility","documents","school","training","theory","practical","testday","result","issuance"].filter(k=>j[k]).length}
function journeyStep(id,icon,title,text,extra=""){const done=!!journeyStateForTrack()[id];return `<div class="journey-step ${done?"done":""}"><div class="journey-marker">${done?"✓":icon}</div><div class="journey-body"><div class="row-between"><h3>${title}</h3><button class="journey-toggle ${done?"done":""}" onclick="toggleJourneyStep('${id}')">${done?tx("markPending"):tx("markDone")}</button></div><p>${text}</p>${extra}</div></div>`}
function licenseJourney(){const completed=journeyCompletedCount(),percent=Math.round(completed/9*100);const ageText=state.track==="private"?tx("privateAge"):state.track==="public"?tx("publicAge"):tx("motoAge");return `<div class="section-title"><h2>🪪 ${tx("journeyTitle")}</h2></div>
<div class="card journey-hero"><div class="row-between"><div>${trackPill()}</div><strong>${percent}%</strong></div><p>${tx("journeyIntro")}</p><div class="progressbar"><span style="width:${percent}%"></span></div><small>${completed}/9 · ${tx("journeyProgress")} · ${tx("lastVerified")}: 22/09/2026</small></div>
${journeyStep("eligibility","1",tx("eligibility"),`${tx("eligibilityText")}<br><strong>${tx("minAge")}:</strong> ${ageText}`,`<div class="journey-links"><a href="https://tmo.gov.lb/web/" target="_blank" rel="noopener">${tx("openTmo")} ↗</a></div>`)}
${journeyStep("documents","2",tx("documentsStep"),tx("documentsText"),`<div class="mini-checklist"><span>☐ ${state.lang==="ar"?"إثبات الهوية والمستندات الشخصية المطلوبة":"Identity and required personal documents"}</span><span>☐ ${state.lang==="ar"?"المستندات الطبية المطلوبة للفئة، إن وجدت":"Medical documents required for the category, if applicable"}</span><span>☐ ${state.lang==="ar"?"الطلبات أو الصور أو المستندات الإضافية وفق القائمة الحالية":"Forms, photos or additional items on the current checklist"}</span></div>`)}
${journeyStep("school","3",tx("schoolStep"),tx("schoolStepText"),`<div class="journey-links"><a href="https://dl.tmo.gov.lb/" target="_blank" rel="noopener">${tx("openSchoolPortal")} ↗</a></div>`)}
${journeyStep("training","4",tx("trainingStep"),tx("trainingStepText"),`<div class="journey-links"><a href="https://moim.gov.lb/" target="_blank" rel="noopener">${tx("openMoim")} ↗</a></div>`)}
${journeyStep("theory","5",tx("theoryStep"),tx("theoryStepText"),`<div class="journey-actions"><button class="secondary-btn" onclick="navigate('learn')">📚 ${tx("navLearn")}</button><button class="secondary-btn" onclick="navigate('signs')">🚦 ${tx("signs")}</button><button class="primary-btn" onclick="navigate('examcenter')">🏁 ${state.lang==="ar"?"مركز الامتحان":"Exam Center"}</button></div>`)}
${journeyStep("practical","6",tx("practicalStep"),tx("practicalStepText"),`<div class="journey-actions"><button class="primary-btn" onclick="navigate('${state.track==="motorcycle"?"practical":"circuit"}')">🚘 ${tx("goPractical")}</button></div>`)}
${journeyStep("testday","7",tx("testDayStep"),tx("testDayStepText"),`<div class="mini-checklist"><span>☐ ${state.lang==="ar"?"تأكيد الموعد والمكان":"Confirm appointment and location"}</span><span>☐ ${state.lang==="ar"?"تجهيز المستندات المطلوبة":"Prepare required documents"}</span><span>☐ ${state.lang==="ar"?"مراجعة خفيفة للإشارات والأخطاء المتكررة":"Light review of signs and recurring mistakes"}</span></div>`)}
${journeyStep("result","8",tx("resultStep"),tx("resultStepText"),`<div class="journey-actions"><button class="secondary-btn" onclick="navigate('progress')">📊 ${tx("navProgress")}</button><button class="secondary-btn" onclick="navigate('practice')">📝 ${tx("reviewMistakes")}</button></div>`)}
${journeyStep("issuance","9",tx("issuanceStep"),tx("issuanceStepText"),`<div class="journey-links"><a href="https://tmo.gov.lb/web/" target="_blank" rel="noopener">${tx("openTmo")} ↗</a></div>`)}
<div class="alert">ℹ️ ${tx("journeyDisclaimer")}</div>`}
function sources(){return `<div class="section-title"><h2>📚 ${tx("sources")}</h2></div><div class="alert">${tx("sourceNote")}</div><br>${Object.entries(D.sources).filter(([k,v])=>v.url).map(([k,v])=>`<div class="card source-card"><h3>${label(v.short)}</h3><small>${v.url}</small><br><br><a href="${v.url}" target="_blank" rel="noopener">${tx("openSource")} ↗</a></div>`).join("")}`}
function mock(){startQuiz("all",30,true)}
function render(){if(state.practiceSession){app.innerHTML=practiceSessionView();return}if(state.quiz){app.innerHTML=quizView();return}if(state.signQuiz){app.innerHTML=signQuizView();return}const map={home,learn,signs,practice,progress,profile,practical,circuit:practicalCircuit,sim:()=>{setTimeout(()=>startCircuitDrill(5,"practice"),0);return `<div class="card center">🎮 ${state.lang==="ar"?"فتح محاكي الركن الجديد...":"Opening new parking simulator..."}</div>`},garage:()=>{setTimeout(()=>startCircuitDrill(2,"practice"),0);return `<div class="card center">🎮 ${state.lang==="ar"?"فتح محاكي الركن الجديد...":"Opening new parking simulator..."}</div>`},hill:hillSim,passenger:passengerSim,smooth:smoothSim,moto:motoSim,preride:preRideSim,motolane:motoLaneSim,sources,mock,examcenter:examCenter,journey:licenseJourney};app.innerHTML=(map[state.route]||home)()}
let onboardingStep=1;
function chooseOnboardLang(l){
 state.lang=l;save();applyLang();render();onboardingStep=2;renderOnboarding();
}
function chooseOnboardRole(r){
 state.role=r;save();state.route="home";render();onboardingStep=3;renderOnboarding();
}
function onboardingBack(){
 if(onboardingStep>1){onboardingStep--;renderOnboarding()}
}
function renderOnboarding(){
 if(state.onboarded){onboard.classList.add("hidden");return}
 onboard.classList.remove("hidden");
 const progress=`<div class="onboard-progress"><span class="${onboardingStep===1?"active":""}"></span><span class="${onboardingStep===2?"active":""}"></span><span class="${onboardingStep===3?"active":""}"></span><small>${onboardingStep}/3</small></div>`;
 let body="";
 if(onboardingStep===1){
   body=`<div class="onboard-step-head"><h3>${tx("chooseLang")}</h3></div>
   <p class="onboard-note">${state.lang==="ar"?"يمكنك تغيير اللغة لاحقاً من أعلى التطبيق.":"You can change the language later from the top of the app."}</p>
   <button class="choice ${state.lang==="ar"?"active":""}" onclick="chooseOnboardLang('ar')"><span style="font-size:1.5rem">ع</span><div><strong>العربية</strong><small>واجهة كاملة</small></div></button>
   <button class="choice ${state.lang==="en"?"active":""}" onclick="chooseOnboardLang('en')"><span style="font-size:1.35rem">EN</span><div><strong>English</strong><small>Full interface</small></div></button>`;
 }else if(onboardingStep===2){
   body=`<div class="onboard-step-head"><button class="onboard-back" onclick="onboardingBack()">←</button><h3>${tx("chooseRole")}</h3></div>
   <button class="choice ${state.role==="student"?"active":""}" onclick="chooseOnboardRole('student')"><span style="font-size:1.45rem">👤</span><div><strong>${tx("student")}</strong><small>${tx("studentDesc")}</small></div></button>
   <button class="choice ${state.role==="school"?"active":""}" onclick="chooseOnboardRole('school')"><span style="font-size:1.45rem">🏫</span><div><strong>${tx("school")}</strong><small>${tx("schoolDesc")}</small></div></button>`;
 }else{
   body=`<div class="onboard-step-head"><button class="onboard-back" onclick="onboardingBack()">←</button><h3>${tx("chooseTrack")}</h3></div>
   <p class="onboard-note">${state.lang==="ar"?"اختر فئة الرخصة التي تريد التحضير لها.":"Choose the licence category you want to prepare for."}</p>
   ${trackSelector()}
   <button class="primary-btn full onboard-start" ${!state.track?"disabled":""} onclick="finishOnboarding()">${state.lang==="ar"?"ابدأ Ready2Drive":"Start Ready2Drive"} ←</button>`;
 }
 onboard.innerHTML=`<div class="onboard-card"><div class="onboard-logo">🇱🇧 🚗</div><h1>${tx("onboardTitle")}</h1><p>${tx("onboardText")}</p>${progress}${body}</div>`;
 onboard.scrollTop=0;
}
function finishOnboarding(){if(!state.role||!state.track)return;state.onboarded=true;save();onboard.classList.add("hidden");render()}
document.getElementById("langBtn").onclick=()=>setLang(state.lang==="ar"?"en":"ar");
document.querySelectorAll(".nav-item").forEach(b=>b.onclick=()=>navigate(b.dataset.route));
applyLang();renderOnboarding();render();

</script>

</body>
</html>
