ers, which driving style best protects them?","ar":"عند نقل الركاب، أي أسلوب قيادة يحميهم بشكل أفضل؟"},"a":[{"en":"Smooth acceleration, safe following distance and early braking","ar":"تسارع سلس ومسافة أمان وفرملة مبكرة"},{"en":"Late hard braking","ar":"فرملة قوية ومتأخرة"},{"en":"Fast lane changes","ar":"تغيير مسار سريع"},{"en":"Following very closely","ar":"السير قريباً جداً من المركبة الأمامية"}],"correct":0,"exp":{"en":"Smooth, predictable driving reduces risk and passenger injury.","ar":"القيادة السلسة والمتوقعة تقلل المخاطر وإصابات الركاب."}},{"id":205,"tracks":["public"],"cat":"parking","source":"principle","q":{"en":"Before opening a passenger door into traffic, what should be considered?","ar":"قبل فتح باب الركاب باتجاه حركة السير، ماذا يجب مراعاته؟"},"a":[{"en":"Whether cyclists, motorcycles, pedestrians or vehicles are approaching","ar":"وجود دراجات أو مشاة أو مركبات مقتربة"},{"en":"Only the fare","ar":"الأجرة فقط"},{"en":"The radio","ar":"الراديو"},{"en":"Nothing if the vehicle is stopped","ar":"لا شيء إذا كانت المركبة متوقفة"}],"correct":0,"exp":{"en":"Stopping does not remove the need to check for road users beside the vehicle.","ar":"التوقف لا يلغي ضرورة التأكد من عدم وجود مستخدمي طريق بجانب المركبة."}},{"id":206,"tracks":["public"],"cat":"documents","source":"enforcement","q":{"en":"For a public/commercial driver, why is document readiness especially important?","ar":"لماذا تعتبر جاهزية الأوراق مهمة بشكل خاص لسائق السيارة العمومية؟"},"a":[{"en":"Traffic checks may verify driver and vehicle legal documents","ar":"قد تتحقق الحواجز من أوراق السائق والمركبة القانونية"},{"en":"Documents improve fuel economy","ar":"الأوراق تقلل استهلاك الوقود"},{"en":"Documents replace safe driving","ar":"الأوراق تغني عن القيادة الآمنة"},{"en":"Only passengers need documents","ar":"الركاب فقط يحتاجون أوراقاً"}],"correct":0,"exp":{"en":"Traffic checkpoints can verify the driving licence, vehicle registration, insurance and other required documents.","ar":"قد تتحقق الحواجز م ","ar":"إغلاق عين واحدة"}],"correct":0,"exp":{"en":"A shoulder check helps detect vehicles hidden from the mirrors.","ar":"فحص الكتف يساعد على كشف المركبات المختفية عن المرايا."}},{"id":307,"tracks":["motorcycle"],"cat":"motorcycle","source":"principle","q":{"en":"Why is smooth braking important on a motorcycle?","ar":"لماذا تعتبر الفرملة السلسة مهمة على الدراجة الآلية؟"},"a":[{"en":"Abrupt braking can reduce stability and grip","ar":"الفرملة المفاجئة قد تقلل الثبات والتماسك"},{"en":"It makes the horn louder","ar":"تجعل الزمور أعلى"},{"en":"It turns on the indicators","ar":"تشغل الإشارات"},{"en":"It changes the licence category","ar":"تغير فئة الرخصة"}],"correct":0,"exp":{"en":"Progressive braking helps preserve tyre grip and motorcycle stability.","ar":"الفرملة التدريجية تساعد على الحفاظ على تماسك الإطارات وثبات الدراجة."}},{"id":308,"tracks":["motorcycle"],"cat":"exam","source":"law","q":{"en":"Does Lebanese Traffic Law treat motorcycles as their own driving-licence category?","ar":"هل يعتبر قانون السير اللبناني الدراجات الآلية فئة مستقلة من فئات رخص السوق؟"},"a":[{"en":"Yes","ar":"نعم"},{"en":"No","ar":"لا"},{"en":"Only outside Beirut","ar":"فقط خارج بيروت"},{"en":"Only for public use","ar":"فقط للاستعمال العمومي"}],"correct":0,"exp":{"en":"Motorcycles are the first licence category listed in Article 198, with subcategories under Article 199.","ar":"الدراجات الآلية هي الفئة الأولى المذكورة في المادة 198، ولها فروع في المادة 199."}},{"id":31,"tracks":["all"],"cat":"weather","source":"principle","q":{"en":"When visibility becomes poor in rain or fog, what should you do first?","ar":"عندما تصبح الرؤية ضعيفة بسبب المطر أو الضباب، ماذا تفعل أولاً?"},"a":[{"en":"Reduce speed and increase safety distance","ar":"خفف السرعة وزد مسافة الأمان"},{"en":"Drive faster","ar":"زد السرعة"},{"en":"Follow closely","ar":"اقترب من المركبة أمامك"},{"en":"Turn off lights","ar":"أطفئ الأضواء"}],"correct":0,"exp":{"en":"Lower speed and more space give you more time to react.","ar":"السرعة ignals","source":"moim_guide","q":{"en":"On a road with a prescribed direction of travel, what should the driver do?","ar":"على طريق ذي اتجاه سير محدد، ماذا يجب على السائق أن يفعل؟"},"a":[{"en":"Follow the prescribed direction","ar":"يلتزم باتجاه السير المحدد"},{"en":"Drive against it if the road is empty","ar":"يسير عكس الاتجاه إذا كان الطريق فارغاً"},{"en":"Use the shoulder in the opposite direction","ar":"يستعمل كتف الطريق بعكس الاتجاه"},{"en":"Choose either direction at night","ar":"يختار أي اتجاه ليلاً"}],"correct":0,"exp":{"en":"Drivers must follow the designated direction of travel.","ar":"يجب على السائق الالتزام باتجاه السير المحدد."}},{"id":47,"tracks":["all"],"cat":"safety","source":"moim_guide","q":{"en":"What should you do when visibility becomes poor?","ar":"ماذا يجب أن تفعل عندما تصبح الرؤية سيئة؟"},"a":[{"en":"Reduce speed and stop if conditions require it","ar":"خفف السرعة وتوقف إذا اقتضت الظروف"},{"en":"Increase speed to leave the area quickly","ar":"زد السرعة للخروج من المنطقة بسرعة"},{"en":"Follow the vehicle ahead very closely","ar":"اقترب كثيراً من المركبة أمامك"},{"en":"Switch off all lights","ar":"أطفئ جميع الأضواء"}],"correct":0,"exp":{"en":"Poor visibility requires more time and space to react.","ar":"ضعف الرؤية يتطلب وقتاً ومسافة أكبر للتصرف."}},{"id":48,"tracks":["all"],"cat":"priority","source":"moim_guide","q":{"en":"When overtaking is lawful and safe, from which side is it normally performed?","ar":"عندما يكون التجاوز قانونياً وآمناً، من أي جهة يتم عادةً؟"},"a":[{"en":"From the left","ar":"من اليسار"},{"en":"From the right in every situation","ar":"من اليمين في كل الحالات"},{"en":"From the shoulder","ar":"من كتف الطريق"},{"en":"From whichever side is shorter","ar":"من أي جهة أقصر"}],"correct":0,"exp":{"en":"The normal overtaking side is the left, subject to the road layout and lawful exceptions.","ar":"القاعدة العامة أن يتم التجاوز من اليسار مع مراعاة تصميم الطريق والاستثناءات القانونية."}},{"id":49,"tracks":["all"],"cat":"safety","source":"moim_guide","q":{"en":"Before starting an overtaking manoeuvre, what should you check behind you?","ar":"قبل البدء بمناورة التجاوز، ماذا يجب أن تتحقق منه خلفك؟"},"a":[{"en":"That another driver has not already started overtaking you","ar":"ألا يكون سائق آخر قد بدأ بتجاوزك"},{"en":"Only that your rear window is clean","ar":"فقط أن الزجاج الخلفي نظيف"},{"en":"Only the fuel level","ar":"فقط مستوى الوقود"},{"en":"Nothing if you have signaled","ar":"لا شيء إذا كنت قد أعطيت الإشارة"}],"correct":0,"exp":{"en":"A mirror and blind-area check helps prevent moving into another overtaking vehicle.","ar":"فحص المرايا والمناطق غير المرئية يساعد على تجنب الدخول في مسار مركبة بدأت بتجاوزك."}},{"id":50,"tracks":["all"],"cat":"priority","source":"moim_guide","q":{"en":"Why is overtaking on a blind bend dangerous?","ar":"لماذا يعتبر التجاوز عند منعطف محجوب الرؤية خطراً؟"},"a":[{"en":"You may not see oncoming traffic in time","ar":"قد لا ترى حركة السير المقابلة في الوقت المناسب"},{"en":"The road becomes wider","ar":"يصبح الطريق أعرض"},{"en":"Your mirrors stop working","ar":"تتوقف المرايا عن العمل"},{"en":"The speed limit automatically doubles","ar":"يتضاعف حد السرعة تلقائياً"}],"correct":0,"exp":{"en":"Limited sight distance can hide oncoming vehicles.","ar":"مسافة الرؤية المحدودة قد تخفي المركبات القادمة من الاتجاه المقابل."}},{"id":51,"tracks":["all"],"cat":"priority","source":"moim_guide","q":{"en":"What is the safest rule near a railway crossing when considering an overtake?","ar":"ما القاعدة الأكثر أماناً قرب ممر سكة حديد عند التفكير بالتجاوز؟"},"a":[{"en":"Do not overtake where the crossing or visibility makes it unsafe or prohibited","ar":"لا تتجاوز إذا كان الممر أو مدى الرؤية يجعل التجاوز خطراً أو ممنوعاً"},{"en":"Overtake quickly before the train arrives","ar":"تجاوز بسرعة قبل وصول القطار"},{"en":"Stop on the railway line to check","ar":"توقف على السكة للتحقق"},{"en":"Use the opposite shoulder","ar":"استعمل كتف الطريق المقابل"}],"correct":0,"exp":{"en":"Railway crossings require maximum visibility and caution.","ar":"ممرات السكك الحديدية تتطلب أعلى درجات الرؤية والحذر."}},{"id":52,"tracks":["all"],"cat":"priority","source":"moim_guide","q":{"en":"What should you do about overtaking in a tunnel or on a bridge when visibility or rules prohibit it?","ar":"ماذا تفعل بشأن التجاوز داخل نفق أو على جسر عندما تمنعه القواعد أو تكون الرؤية غير كافية؟"},"a":[{"en":"Do not overtake","ar":"لا تتجاوز"},{"en":"Overtake using the shoulder","ar":"تجاوز باستعمال كتف الطريق"},{"en":"Use hazard lights and overtake","ar":"شغّل أضواء التحذير وتجاوز"},{"en":"Sound the horn and overtake","ar":"استعمل الزمور وتجاوز"}],"correct":0,"exp":{"en":"Constrained road sections leave less space and visibility for safe overtaking.","ar":"المقاطع الضيقة مثل الأنفاق والجسور توفر مساحة ورؤية أقل للتجاوز الآمن."}},{"id":53,"tracks":["all"],"cat":"priority","source":"moim_guide","q":{"en":"A line of vehicles is stopped because traffic is blocked ahead. What should you do?","ar":"رتل من المركبات متوقف بسبب عرقلة السير أمامه. ماذا يجب أن تفعل؟"},"a":[{"en":"Do not try to overtake the stopped queue if doing so is unsafe or prohibited","ar":"لا تحاول تجاوز الرتل المتوقف إذا كان ذلك خطراً أو ممنوعاً"},{"en":"Use the opposite lane automatically","ar":"استعمل المسار المقابل تلقائياً"},{"en":"Drive on the sidewalk","ar":"قد على الرصيف"},{"en":"Force your way between vehicles","ar":"مرّ بالقوة بين المركبات"}],"correct":0,"exp":{"en":"A stopped queue can conceal hazards and intersections ahead.","ar":"قد يخفي الرتل المتوقف مخاطر أو تقاطعات أمامك."}},{"id":54,"tracks":["all"],"cat":"weather","source":"moim_guide","q":{"en":"How does a wet road generally affect stopping distance?","ar":"كيف يؤثر الطريق المبلل عادةً على مسافة التوقف؟"},"a":[{"en":"It increases the distance needed to stop","ar":"يزيد المسافة اللازمة للتوقف"},{"en":"It always shortens stopping distance","ar":"يقلل مسافة التوقف دائماً"},{"en":"It has no effect","ar":"لا يؤثر عليها"},{"en":"It eliminates tyre slip","ar":"يلغي انزلاق الإطارات"}],"correct":0,"exp":{"en":"Wet surfaces reduce available grip, so more stopping space may be needed.","ar":"السطح المبلل يقلل التماسك، لذلك قد تحتاج إلى مسافة توقف أكبر."}},{"id":55,"tracks":["all"],"cat":"signals","source":"moim_guide","q":{"en":"If your direction indicators fail, what should you do before turning or changing direction?","ar":"إذا تعطلت إشارات الاتجاه، ماذا يجب أن تفعل قبل الانعطاف أو تغيير الاتجاه؟"},"a":[{"en":"Use an appropriate hand signal when it can be done safely","ar":"استعمل إشارة يد مناسبة عندما يمكن القيام بذلك بأمان"},{"en":"Turn without any warning","ar":"انعطف من دون أي تنبيه"},{"en":"Use only the horn","ar":"استعمل الزمور فقط"},{"en":"Switch off the headlights","ar":"أطفئ المصابيح الأمامية"}],"correct":0,"exp":{"en":"Other road users still need a clear warning of your intended movement.","ar":"يجب أن يتلقى مستخدمو الطريق الآخرون تنبيهاً واضحاً عن الحركة التي تنوي القيام بها."}},{"id":56,"tracks":["all"],"cat":"vehicle","source":"moim_guide","q":{"en":"If your vehicle breaks down on a fast road, what should you do first?","ar":"إذا تعطلت مركبتك على طريق سريع، ماذا يجب أن تفعل أولاً؟"},"a":[{"en":"Move to a safe place if possible, use hazard warnings and protect the scene","ar":"انتقل إلى مكان آمن إن أمكن واستعمل أضواء التحذير واحمِ موقع العطل"},{"en":"Leave the vehicle in the live lane without warning","ar":"اترك المركبة في مسار السير من دون تحذير"},{"en":"Turn off all lights at night","ar":"أطفئ جميع الأضواء ليلاً"},{"en":"Stand in the traffic lane","ar":"قف في مسار السير"}],"correct":0,"exp":{"en":"Warning other drivers and reducing exposure to moving traffic are priorities.","ar":"تنبيه السائقين الآخرين وتقليل التعرض لحركة السير من الأولويات."}},{"id":57,"tracks":["all"],"cat":"signals","source":"moim_guide","q":{"en":"After one train passes at a railway crossing, what should you do before crossing?","ar":"بعد مرور قطار عند ممر سكة حديد، ماذا يجب أن تفعل قبل العبور؟"},"a":[{"en":"Check that no second train is approaching and that the crossing is clear","ar":"تأكد من عدم اقتراب قطار ثانٍ وأن الممر أصبح خالياً"},{"en":"Cross immediately without looking","ar":"اعبر فوراً من دون النظر"},{"en":"Follow the vehicle ahead regardless of signals","ar":"اتبع المركبة أمامك مهما كانت الإشارات"},{"en":"Stop on the tracks","ar":"توقف فوق السكة"}],"correct":0,"exp":{"en":"A second train may be approaching on another track.","ar":"قد يكون هناك قطار ثانٍ يقترب على مسار آخر."}},{"id":58,"tracks":["all"],"cat":"signals","source":"moim_guide","q":{"en":"What do brake lights on the vehicle ahead tell you?","ar":"ماذا تعني أنوار الفرامل في المركبة أمامك؟"},"a":[{"en":"The vehicle is slowing or stopping","ar":"أن المركبة تخفف السرعة أو تتوقف"},{"en":"The driver is turning left","ar":"أن السائق سينعطف يساراً"},{"en":"The vehicle is reversing","ar":"أن المركبة ترجع للخلف"},{"en":"The horn is active","ar":"أن الزمور يعمل"}],"correct":0,"exp":{"en":"Brake lights warn following traffic that speed is being reduced or the vehicle is stopping.","ar":"أنوار الفرامل تنبه المركبات الخلفية إلى تخفيف السرعة أو التوقف."}},{"id":59,"tracks":["all"],"cat":"safety","source":"moim_guide","q":{"en":"Before changing lanes, what should you confirm?","ar":"قبل تغيير المسار، ماذا يجب أن تتأكد منه؟"},"a":[{"en":"That the change can be made without danger, then signal your intention","ar":"أن تغيير المسار يمكن أن يتم من دون خطر ثم أعطِ الإشارة"},{"en":"That your radio is off","ar":"أن الراديو مطفأ"},{"en":"That the vehicle behind is the same color","ar":"أن المركبة خلفك من اللون نفسه"},{"en":"That you are already halfway into the lane","ar":"أنك أصبحت في منتصف المسار الجديد"}],"correct":0,"exp":{"en":"Safety checks and a clear signal should precede the lane change.","ar":"فحوص السلامة والإشارة الواضحة يجب أن تسبقا تغيير المسار."}},{"id":60,"tracks":["all"],"cat":"priority","source":"moim_guide","q":{"en":"When leaving one road to enter another, what lane position is generally safest before the turn?","ar":"عند ترك طريق للدخول إلى طريق آخر، ما موقع المسار الأكثر أماناً عادةً قبل الانعطاف؟"},"a":[{"en":"Use the appropriate lane nearest the intended direction and position early","ar":"استعمل المسار المناسب الأقرب لاتجاه الانعطاف واتخذ موقعك مبكراً"},{"en":"Move across several lanes at the last moment","ar":"اقطع عدة مسارات في اللحظة الأخيرة"},{"en":"Drive on the shoulder","ar":"قد على كتف الطريق"},{"en":"Stop in the middle of the road","ar":"توقف في وسط الطريق"}],"correct":0,"exp":{"en":"Early correct lane positioning makes the manoeuvre more predictable and safer.","ar":"اتخاذ المسار الصحيح مبكراً يجعل المناورة أكثر وضوحاً وأماناً."}},{"id":61,"tracks":["all"],"cat":"priority","source":"moim_guide","q":{"en":"When meeting an oncoming vehicle on a normal two-way road, what should you do?","ar":"عند مقابلة مركبة قادمة من الاتجاه المعاكس على طريق باتجاهين، ماذا يجب أن تفعل؟"},"a":[{"en":"Keep to your right and leave safe clearance","ar":"التزم يمينك واترك مسافة آمنة"},{"en":"Move toward the center line","ar":"اقترب من وسط الطريق"},{"en":"Flash your lights and use the opposite lane","ar":"استعمل الأضواء وانتقل للمسار المقابل"},{"en":"Stop diagonally across your lane","ar":"توقف بشكل مائل عبر المسار"}],"correct":0,"exp":{"en":"Keeping right and maintaining clearance reduces conflict with oncoming traffic.","ar":"الالتزام باليمين وترك مسافة آمنة يقللان خطر الاصطدام بالمركبات المقابلة."}},{"id":62,"tracks":["all"],"cat":"vehicle","source":"moim_guide","q":{"en":"If a tyre suddenly loses pressure while driving, what is the safest immediate response?","ar":"إذا فقد أحد الإطارات ضغطه فجأة أثناء القيادة، ما هو التصرف الفوري الأكثر أماناً؟"},"a":[{"en":"Hold the steering firmly and reduce speed gradually","ar":"أمسك المقود بثبات وخفف السرعة تدريجياً"},{"en":"Brake as hard as possible immediately","ar":"افرمل بأقصى قوة فوراً"},{"en":"Turn sharply toward the shoulder","ar":"انعطف فجأة نحو كتف الطريق"},{"en":"Accelerate to stabilize the car","ar":"زد السرعة لتثبيت السيارة"}],"correct":0,"exp":{"en":"A smooth reduction in speed helps preserve control after a sudden tyre problem.","ar":"تخفيف السرعة بسلاسة يساعد على الحفاظ على التحكم بعد مشكلة مفاجئة في الإطار."}},{"id":119,"tracks":["private"],"cat":"safety","source":"previous_project","q":{"en":"If your vehicle is moving noticeably slower than normal traffic, where should you generally position it when safe?","ar":"إذا كانت مركبتك تسير أبطأ بوضوح من حركة السير العادية، أين يجب أن تتموضع عادةً عندما يكون ذلك آمناً؟"},"a":[{"en":"Toward the right side/lane appropriate for slower traffic","ar":"نحو الجهة أو المسار الأيمن المناسب للسير الأبطأ"},{"en":"In the fastest lane","ar":"في أسرع مسار"},{"en":"Across two lanes","ar":"بين مسارين"},{"en":"On the center line","ar":"فوق خط الوسط"}],"correct":0,"exp":{"en":"Slower traffic should avoid unnecessarily obstructing faster traffic.","ar":"يجب على المركبات الأبطأ تجنب عرقلة حركة السير الأسرع من دون حاجة."}},{"id":120,"tracks":["private"],"cat":"safety","source":"previous_project","q":{"en":"As a defensive driver, what should you do if insisting on your priority could cause a collision?","ar":"كسائق احترازي، ماذا تفعل إذا كان الإصرار على أفضليتك قد يسبب حادثاً؟"},"a":[{"en":"Yield if necessary to avoid the collision","ar":"تنازل عن الأفضلية عند الحاجة لتجنب الحادث"},{"en":"Accelerate because priority is your right","ar":"تسارع لأن الأفضلية حقك"},{"en":"Block the other vehicle","ar":"امنع المركبة الأخرى من المرور"},{"en":"Sound the horn continuously","ar":"استعمل الزمور باستمرار"}],"correct":0,"exp":{"en":"Avoiding a collision is more important than asserting priority.","ar":"تجنب الحادث أهم من الإصرار على استعمال الأفضلية."}},{"id":121,"tracks":["private"],"cat":"safety","source":"previous_project","q":{"en":"What danger can come from parked vehicles along the right side of the road?","ar":"ما الخطر الذي قد ينتج عن المركبات المتوقفة على الجانب الأيمن من الطريق؟"},"a":[{"en":"A vehicle may pull out or a door may open unexpectedly","ar":"قد تنطلق مركبة أو يُفتح باب بشكل مفاجئ"},{"en":"Their tyres always burst","ar":"تنفجر إطاراتها دائماً"},{"en":"They automatically have priority","ar":"لها أفضلية تلقائية"},{"en":"They turn the traffic light red","ar":"تحول الإشارة الضوئية إلى الأحمر"}],"correct":0,"exp":{"en":"Leave space and be prepared for doors or vehicles moving into your path.","ar":"اترك مسافة وكن مستعداً لفتح باب أو دخول مركبة إلى مسارك."}},{"id":122,"tracks":["private"],"cat":"safety","source":"previous_project","q":{"en":"How can lack of sleep affect a driver?","ar":"كيف يمكن أن تؤثر قلة النوم على السائق؟"},"a":[{"en":"It slows reactions and reduces concentration","ar":"تبطئ ردات الفعل وتقلل التركيز"},{"en":"It improves reaction time","ar":"تحسن سرعة الاستجابة"},{"en":"It improves night vision","ar":"تحسن الرؤية الليلية"},{"en":"It makes braking distance shorter","ar":"تقلل مسافة الفرملة"}],"correct":0,"exp":{"en":"Fatigue reduces attention, judgment and reaction ability.","ar":"التعب يقلل الانتباه والقدرة على الحكم وسرعة الاستجابة."}},{"id":123,"tracks":["private"],"cat":"signals","source":"previous_project","q":{"en":"If traffic lights at an intersection are not working, how should you approach?","ar":"إذا تعطلت الإشارات الضوئية عند تقاطع، كيف يجب أن تتصرف؟"},"a":[{"en":"Treat the intersection cautiously as uncontrolled and follow signs/priority rules","ar":"تعامل مع التقاطع بحذر كتقاطع غير منظم واتبع إشارات وأولويات المرور"},{"en":"Assume you always have priority","ar":"افترض أن لك الأفضلية دائماً"},{"en":"Drive through without slowing","ar":"اعبر من دون تخفيف السرعة"},{"en":"Wait indefinitely even when safe","ar":"انتظر إلى ما لا نهاية حتى لو أصبح العبور آمناً"}],"correct":0,"exp":{"en":"Without functioning signals, drivers must rely on signs, priority rules and careful observation.","ar":"عند تعطل الإشارات يجب الاعتماد على اللوحات وقواعد الأولوية والمراقبة الحذرة."}},{"id":124,"tracks":["private"],"cat":"priority","source":"previous_project","q":{"en":"When turning right on a green light, what must you still watch for?","ar":"عند الانعطاف يميناً على الضوء الأخضر، ماذا يجب أن تراعي أيضاً؟"},"a":[{"en":"Pedestrians and other road users crossing your path","ar":"المشاة ومستخدمي الطريق الذين يقطعون مسارك"},{"en":"Only the dashboard clock","ar":"ساعة لوحة العدادات فقط"},{"en":"Only vehicles behind you","ar":"المركبات خلفك فقط"},{"en":"Nothing because green gives absolute priority","ar":"لا شيء لأن الضوء الأخضر يعطي أفضلية مطلقة"}],"correct":0,"exp":{"en":"A green light does not remove the duty to protect pedestrians and avoid conflict.","ar":"الضوء الأخضر لا يلغي واجب حماية المشاة وتجنب التعارض مع مستخدمي الطريق."}},{"id":125,"tracks":["private"],"cat":"safety","source":"previous_project","q":{"en":"Who should wear a seat belt in a car where belts are provided?","ar":"من يجب أن يضع حزام الأمان في السيارة عندما تكون الأحزمة متوفرة؟"},"a":[{"en":"All occupants who have a belt available","ar":"جميع الركاب الذين يتوفر لهم حزام"},{"en":"Only the driver","ar":"السائق فقط"},{"en":"Only front passengers","ar":"الركاب الأماميون فقط"},{"en":"Only passengers under 18","ar":"الركاب دون 18 سنة فقط"}],"correct":0,"exp":{"en":"Seat belts reduce injury risk for all restrained occupants.","ar":"أحزمة الأمان تقلل خطر الإصابة لجميع الركاب الذين يستعملونها."}},{"id":126,"tracks":["private"],"cat":"parking","source":"principle","q":{"en":"While parking, a pedestrian steps into the space behind your car. What should you do?","ar":"أثناء الركن، دخل أحد المشاة إلى المساحة خلف سيارتك. ماذا يجب أن تفعل؟"},"a":[{"en":"Stop the manoeuvre and wait until the path is safe","ar":"أوقف المناورة وانتظر حتى يصبح المسار آمناً"},{"en":"Continue slowly without stopping","ar":"تابع ببطء من دون توقف"},{"en":"Reverse faster","ar":"ارجع للخلف بسرعة أكبر"},{"en":"Use the horn and keep moving","ar":"استعمل الزمور وتابع الحركة"}],"correct":0,"exp":{"en":"A parking manoeuvre must stop whenever a vulnerable road user is at risk.","ar":"يجب إيقاف مناورة الركن عندما يكون أحد مستخدمي الطريق الضعفاء معرضاً للخطر."}},{"id":127,"tracks":["private"],"cat":"parking","source":"principle","q":{"en":"What is the best way to reverse a private car in a confined area?","ar":"ما أفضل طريقة للرجوع بالسيارة الخصوصية في مساحة ضيقة؟"},"a":[{"en":"Move slowly and keep observing all around the vehicle","ar":"تحرك ببطء وواصل مراقبة محيط السيارة"},{"en":"Reverse quickly before traffic arrives","ar":"ارجع بسرعة قبل وصول حركة السير"},{"en":"Look only in one mirror","ar":"انظر في مرآة واحدة فقط"},{"en":"Use the horn instead of looking","ar":"استعمل الزمور بدلاً من المراقبة"}],"correct":0,"exp":{"en":"Slow speed and all-round observation give you time to stop and correct.","ar":"السرعة البطيئة والمراقبة الشاملة تمنحانك وقتاً للتوقف والتصحيح."}},{"id":128,"tracks":["private"],"cat":"vehicle","source":"principle","q":{"en":"What should you adjust before starting to drive?","ar":"ماذا يجب أن تضبط قبل بدء القيادة؟"},"a":[{"en":"Seat, mirrors and driving position","ar":"المقعد والمرايا ووضعية القيادة"},{"en":"Phone notifications","ar":"إشعارات الهاتف"},{"en":"Music volume first","ar":"صوت الموسيقى أولاً"},{"en":"Air freshener position","ar":"مكان معطر السيارة"}],"correct":0,"exp":{"en":"Correct seating and mirror adjustment improves control and visibility.","ar":"ضبط المقعد والمرايا بشكل صحيح يحسن التحكم والرؤية."}},{"id":129,"tracks":["private"],"cat":"vehicle","source":"principle","q":{"en":"Why must the windscreen and windows used for observation be clear?","ar":"لماذا يجب أن يكون الزجاج الأمامي والنوافذ المستخدمة للمراقبة واضحة؟"},"a":[{"en":"To maintain a clear view of hazards and road users","ar":"للحفاظ على رؤية واضحة للمخاطر ومستخدمي الطريق"},{"en":"Only for appearance","ar":"للمظهر فقط"},{"en":"To increase engine power","ar":"لزيادة قوة المحرك"},{"en":"To reduce fuel consumption","ar":"لتقليل استهلاك الوقود"}],"correct":0,"exp":{"en":"Good visibility is essential for safe decisions.","ar":"الرؤية الجيدة أساسية لاتخاذ قرارات قيادة آمنة."}},{"id":130,"tracks":["private"],"cat":"safety","source":"principle","q":{"en":"A child is standing close to the edge of the road. What should you expect?","ar":"طفل يقف قريباً من حافة الطريق. ماذا يجب أن تتوقع؟"},"a":[{"en":"The child may move into the road unexpectedly","ar":"قد يدخل الطفل إلى الطريق بشكل مفاجئ"},{"en":"The child will always wait","ar":"سينتظر الطفل دائماً"},{"en":"You can safely accelerate","ar":"يمكنك التسارع بأمان"},{"en":"The child has no effect on your driving","ar":"لا يؤثر وجود الطفل على قيادتك"}],"correct":0,"exp":{"en":"Children can act unpredictably, so slow down and be ready to stop.","ar":"قد يتصرف الأطفال بشكل غير متوقع، لذلك خفف السرعة واستعد للتوقف."}},{"id":131,"tracks":["private"],"cat":"roundabout","source":"principle","q":{"en":"If you miss your intended exit at a roundabout, what is the safer choice?","ar":"إذا فاتك المخرج المقصود في المستديرة، ما الخيار الأكثر أماناً؟"},"a":[{"en":"Continue around safely and take another opportunity to exit","ar":"تابع الدوران بأمان وخذ فرصة أخرى للخروج"},{"en":"Reverse to the missed exit","ar":"ارجع للخلف نحو المخرج"},{"en":"Stop in the circulating lane","ar":"توقف في مسار الدوران"},{"en":"Cut across lanes suddenly","ar":"اقطع المسارات فجأة"}],"correct":0,"exp":{"en":"Never reverse or make a sudden cross-lane movement inside circulating traffic.","ar":"لا ترجع للخلف ولا تقطع المسارات فجأة داخل حركة السير في المستديرة."}},{"id":132,"tracks":["private"],"cat":"safety","source":"principle","q":{"en":"Before opening a car door on the traffic side, what should you check?","ar":"قبل فتح باب السيارة من جهة السير، ماذا يجب أن تتحقق منه؟"},"a":[{"en":"Vehicles, motorcycles, bicycles and pedestrians approaching beside you","ar":"المركبات والدراجات والمشاة المقتربون بجانبك"},{"en":"Only the fuel level","ar":"مستوى الوقود فقط"},{"en":"Only the rear seat","ar":"المقعد الخلفي فقط"},{"en":"Nothing once the engine is off","ar":"لا شيء بعد إطفاء المحرك"}],"correct":0,"exp":{"en":"Opening a door can endanger road users passing close to the vehicle.","ar":"فتح الباب قد يعرض مستخدمي الطريق المارين قرب المركبة للخطر."}},{"id":133,"tracks":["private"],"cat":"parking","source":"principle","q":{"en":"If your car becomes badly positioned during a parking manoeuvre, what is best?","ar":"إذا أصبحت وضعية سيارتك سيئة أثناء مناورة الركن، ما الأفضل؟"},"a":[{"en":"Stop, observe and correct calmly","ar":"توقف وراقب وصحح الوضع بهدوء"},{"en":"Force the manoeuvre quickly","ar":"أكمل المناورة بسرعة وبالقوة"},{"en":"Ignore the kerb and continue","ar":"تجاهل الرصيف وتابع"},{"en":"Accelerate to finish faster","ar":"زد السرعة لإنهاء المناورة"}],"correct":0,"exp":{"en":"Controlled corrections are safer than rushing.","ar":"التصحيح الهادئ وتحت السيطرة أكثر أماناً من الاستعجال."}},{"id":134,"tracks":["private"],"cat":"safety","source":"principle","q":{"en":"How should mirror checks be used during normal driving?","ar":"كيف يجب استعمال المرايا أثناء القيادة العادية؟"},"a":[{"en":"Regularly and before changes in speed or direction","ar":"بشكل منتظم وقبل تغييرات السرعة أو الاتجاه"},{"en":"Only once before starting","ar":"مرة واحدة فقط قبل الانطلاق"},{"en":"Only when the examiner asks","ar":"فقط عندما يطلب الفاحص"},{"en":"Never while moving","ar":"أبداً أثناء الحركة"}],"correct":0,"exp":{"en":"Regular mirror checks help maintain awareness of traffic around you.","ar":"المراقبة المنتظمة للمرايا تساعد على معرفة ما يحدث حول المركبة."}},{"id":135,"tracks":["private"],"cat":"vehicle","source":"principle","q":{"en":"During a hill start, what should you avoid?","ar":"أثناء الانطلاق على طلعة، ماذا يجب أن تتجنب؟"},"a":[{"en":"Uncontrolled rollback into traffic behind","ar":"رجوع المركبة للخلف من دون سيطرة نحو حركة السير"},{"en":"Checking mirrors","ar":"فحص المرايا"},{"en":"Using a safe holding method","ar":"استعمال وسيلة تثبيت آمنة"},{"en":"Moving off smoothly","ar":"الانطلاق بسلاسة"}],"correct":0,"exp":{"en":"A controlled hill start protects vehicles and people behind you.","ar":"الانطلاق المنضبط على طلعة يحمي المركبات والأشخاص خلفك."}},{"id":136,"tracks":["private"],"cat":"safety","source":"principle","q":{"en":"An emergency vehicle approaches using warning lights and siren. What should you do?","ar":"تقترب مركبة طوارئ وهي تستعمل الأضواء التحذيرية والصفارة. ماذا يجب أن تفعل؟"},"a":[{"en":"Make room safely without creating another hazard","ar":"افسح الطريق بأمان من دون خلق خطر آخر"},{"en":"Race the emergency vehicle","ar":"تسابق مع مركبة الطوارئ"},{"en":"Stop anywhere immediately even if dangerous","ar":"توقف في أي مكان فوراً حتى لو كان خطراً"},{"en":"Ignore it if your light is green","ar":"تجاهلها إذا كانت إشارتك خضراء"}],"correct":0,"exp":{"en":"Give emergency vehicles room in a controlled and predictable way.","ar":"افسح الطريق لمركبات الطوارئ بطريقة منضبطة ومتوقعة."}},{"id":219,"tracks":["public"],"cat":"passenger","source":"previous_project","q":{"en":"Where should a public/commercial driver avoid stopping to pick up or drop off passengers?","ar":"أين يجب على سائق المركبة العمومية تجنب التوقف لصعود أو نزول الركاب؟"},"a":[{"en":"At dangerous locations such as bends or where the stop obstructs an intersection","ar":"في الأماكن الخطرة مثل المنعطفات أو حيث يعرقل التوقف التقاطع"},{"en":"Only at a designated safe stopping place","ar":"فقط في مكان توقف آمن ومخصص"},{"en":"At a safe curbside position","ar":"عند جانب الطريق في موقع آمن"},{"en":"At a legal passenger stop","ar":"في موقف قانوني للركاب"}],"correct":0,"exp":{"en":"Passenger stops should never create a visibility or traffic hazard.","ar":"يجب ألا يشكل توقف الركاب خطراً على الرؤية أو حركة السير."}},{"id":220,"tracks":["public"],"cat":"passenger","source":"previous_project","q":{"en":"How can a long conversation with passengers affect a professional driver?","ar":"كيف يمكن أن يؤثر حوار طويل مع الركاب على السائق المهني؟"},"a":[{"en":"It can reduce concentration on the road","ar":"قد يقلل التركيز على الطريق"},{"en":"It always improves reaction time","ar":"يحسن سرعة الاستجابة دائماً"},{"en":"It reduces braking distance","ar":"يقلل مسافة الفرملة"},{"en":"It replaces mirror checks","ar":"يغني عن فحص المرايا"}],"correct":0,"exp":{"en":"Passenger interaction should never distract the driver from the driving task.","ar":"يجب ألا يؤدي التفاعل مع الركاب إلى تشتيت السائق عن مهمة القيادة."}},{"id":221,"tracks":["public"],"cat":"weather","source":"previous_project","q":{"en":"When road, lighting or weather conditions add risk, what should a public driver do?","ar":"عندما تزيد حالة الطريق أو الإنارة أو الطقس من المخاطر، ماذا يجب على السائق العمومي أن يفعل؟"},"a":[{"en":"Slow down and increase attention","ar":"يخفف السرعة ويزيد الانتباه"},{"en":"Maintain the same speed regardless of conditions","ar":"يحافظ على السرعة نفسها مهما كانت الظروف"},{"en":"Follow other vehicles more closely","ar":"يقترب أكثر من المركبات الأخرى"},{"en":"Use the horn continuously","ar":"يستعمل الزمور باستمرار"}],"correct":0,"exp":{"en":"Professional driving requires adapting speed and observation to the conditions.","ar":"القيادة المهنية تتطلب تكييف السرعة والمراقبة مع الظروف."}},{"id":222,"tracks":["public"],"cat":"vehicle","source":"previous_project","q":{"en":"What maintenance approach is best for a public-service vehicle?","ar":"ما نهج الصيانة الأفضل لمركبة الخدمة العمومية؟"},"a":[{"en":"Preventive maintenance before faults become dangerous","ar":"صيانة وقائية قبل أن تتحول الأعطال إلى خطر"},{"en":"Repair only after a breakdown","ar":"الإصلاح فقط بعد حدوث العطل"},{"en":"Ignore minor safety defects","ar":"تجاهل عيوب السلامة البسيطة"},{"en":"Wait for passengers to report problems","ar":"انتظر أن يبلغ الركاب عن المشاكل"}],"correct":0,"exp":{"en":"Preventive maintenance helps keep a vehicle safe and available for service.","ar":"الصيانة الوقائية تساعد على إبقاء المركبة آمنة وجاهزة للخدمة."}},{"id":223,"tracks":["public"],"cat":"vehicle","source":"previous_project","q":{"en":"What factors are important for tyre safety on a public vehicle?","ar":"ما العوامل المهمة لسلامة الإطارات في المركبة العمومية؟"},"a":[{"en":"Condition, age, pressure and suitability","ar":"الحالة والعمر والضغط والملاءمة"},{"en":"Color only","ar":"اللون فقط"},{"en":"Brand name only","ar":"اسم الشركة فقط"},{"en":"Wheel-cover design","ar":"شكل غطاء العجلة"}],"correct":0,"exp":{"en":"Tyres must be suitable and maintained because they affect grip, braking and stability.","ar":"يجب أن تكون الإطارات مناسبة ومصانة لأنها تؤثر على التماسك والفرملة والثبات."}},{"id":224,"tracks":["public"],"cat":"vehicle","source":"previous_project","q":{"en":"How should luggage or cargo be loaded in a public/commercial vehicle?","ar":"كيف يجب تحميل الأمتعة أو الحمولة في مركبة عمومية أو تجارية؟"},"a":[{"en":"Within legal/vehicle limits and secured so it does not affect safe control","ar":"ضمن الحدود القانونية وحدود المركبة ومثبتة بحيث لا تؤثر على التحكم الآمن"},{"en":"As high as possible regardless of weight","ar":"بأعلى ارتفاع ممكن مهما كان الوزن"},{"en":"Loose so it can settle while driving","ar":"من دون تثبيت كي تستقر أثناء السير"},{"en":"Blocking mirrors and windows","ar":"بحيث تحجب المرايا والنوافذ"}],"correct":0,"exp":{"en":"Safe loading protects stability, visibility and braking performance.","ar":"التحميل الآمن يحافظ على الثبات والرؤية وأداء الفرملة."}},{"id":225,"tracks":["public"],"cat":"vehicle","source":"previous_project","q":{"en":"When loading items of different weights, where should the heaviest items generally be placed?","ar":"عند تحميل أمتعة بأوزان مختلفة، أين توضع العناصر الأثقل عادةً؟"},"a":[{"en":"Low and securely positioned","ar":"في الأسفل ومثبتة بشكل آمن"},{"en":"On the roof whenever possible","ar":"على السطح كلما أمكن"},{"en":"On top of lighter loose items","ar":"فوق العناصر الأخف غير المثبتة"},{"en":"Against an emergency exit","ar":"أمام مخرج الطوارئ"}],"correct":0,"exp":{"en":"Keeping heavy items low and secured improves stability.","ar":"إبقاء الأوزان الثقيلة منخفضة ومثبتة يحسن ثبات المركبة."}},{"id":226,"tracks":["public"],"cat":"vehicle","source":"previous_project","q":{"en":"What can a high load on a vehicle roof do?","ar":"ماذا يمكن أن تفعل حمولة مرتفعة على سطح المركبة؟"},"a":[{"en":"Raise the center of gravity and increase rollover risk","ar":"ترفع مركز الثقل وتزيد خطر الانقلاب"},{"en":"Always improve cornering","ar":"تحسن الانعطاف دائماً"},{"en":"Shorten braking distance","ar":"تقلل مسافة الفرملة"},{"en":"Make crosswinds irrelevant","ar":"تلغي تأثير الرياح الجانبية"}],"correct":0,"exp":{"en":"A higher center of gravity reduces stability, especially in turns.","ar":"ارتفاع مركز الثقل يقلل الثبات خاصة أثناء المنعطفات."}},{"id":227,"tracks":["public"],"cat":"passenger","source":"previous_project","q":{"en":"A passenger becomes verbally aggressive. What should a professional driver do?","ar":"أصبح أحد الركاب عدائياً بالكلام. ماذا يجب على السائق المهني أن يفعل؟"},"a":[{"en":"Stay calm, keep control and use a safe/professional response","ar":"يحافظ على هدوئه وتحكمه ويتصرف بطريقة آمنة ومهنية"},{"en":"Argue while driving","ar":"يدخل في جدال أثناء القيادة"},{"en":"Brake suddenly to punish the passenger","ar":"يفرمل فجأة لمعاقبة الراكب"},{"en":"Drive faster to end the trip","ar":"يزيد السرعة لإنهاء الرحلة"}],"correct":0,"exp":{"en":"Maintaining control and avoiding escalation protects everyone.","ar":"الحفاظ على التحكم وتجنب التصعيد يحمي الجميع."}},{"id":228,"tracks":["public"],"cat":"passenger","source":"principle","q":{"en":"What driving style is best for passenger comfort and safety?","ar":"ما أسلوب القيادة الأفضل لراحة الركاب وسلامتهم؟"},"a":[{"en":"Smooth acceleration, adequate spacing and progressive braking","ar":"تسارع سلس ومسافة أمان وفرملة تدريجية"},{"en":"Late hard braking","ar":"فرملة قوية ومتأخرة"},{"en":"Rapid lane changes","ar":"تغيير مسارات سريع"},{"en":"Following very closely","ar":"السير قريباً جداً من المركبة الأمامية"}],"correct":0,"exp":{"en":"Predictable smooth driving reduces falls, discomfort and collision risk.","ar":"القيادة السلسة والمتوقعة تقلل السقوط وعدم الراحة وخطر الحوادث."}},{"id":229,"tracks":["public"],"cat":"passenger","source":"principle","q":{"en":"What makes a good passenger pickup/drop-off position?","ar":"ما الذي يجعل مكان صعود أو نزول الركاب مناسباً؟"},"a":[{"en":"It is legal, visible and does not create danger or block traffic","ar":"أن يكون قانونياً وواضحاً ولا يشكل خطراً أو يعرقل السير"},{"en":"It is closest to the passenger regardless of danger","ar":"أن يكون الأقرب للراكب مهما كان الخطر"},{"en":"It is inside a blind bend","ar":"أن يكون داخل منعطف محجوب"},{"en":"It blocks a pedestrian crossing","ar":"أن يغلق ممر المشاة"}],"correct":0,"exp":{"en":"Passenger convenience must not come before road safety.","ar":"راحة الراكب لا يجب أن تأتي على حساب السلامة المرورية."}},{"id":230,"tracks":["public"],"cat":"passenger","source":"principle","q":{"en":"Before moving after passengers board, what should the driver confirm?","ar":"قبل الانطلاق بعد صعود الركاب، ماذا يجب على السائق أن يتأكد منه؟"},"a":[{"en":"Boarding is complete, doors are secure and movement is safe","ar":"اكتمال الصعود وإغلاق الأبواب وأن الانطلاق آمن"},{"en":"Only that the fare is paid","ar":"فقط أن الأجرة دُفعت"},{"en":"Only that the engine is running","ar":"فقط أن المحرك يعمل"},{"en":"Nothing if the traffic light is green","ar":"لا شيء إذا كانت الإشارة خضراء"}],"correct":0,"exp":{"en":"Passengers must be safely aboard before the vehicle moves.","ar":"يجب أن يكون الركاب قد صعدوا بأمان قبل تحرك المركبة."}},{"id":231,"tracks":["public"],"cat":"passenger","source":"principle","q":{"en":"Before opening a passenger door on the traffic side, what should be checked?","ar":"قبل فتح باب راكب من جهة السير، ماذا يجب فحصه؟"},"a":[{"en":"Approaching motorcycles, bicycles, pedestrians and vehicles","ar":"الدراجات والمشاة والمركبات المقتربة"},{"en":"Only the meter","ar":"العداد فقط"},{"en":"Only the passenger's luggage","ar":"أمتعة الراكب فقط"},{"en":"Nothing once the vehicle is stopped","ar":"لا شيء بعد توقف المركبة"}],"correct":0,"exp":{"en":"A door opening into traffic can seriously endanger a passing road user.","ar":"فتح الباب باتجاه السير قد يعرض مستخدم طريق مارّ لخطر شديد."}},{"id":232,"tracks":["public"],"cat":"documents","source":"principle","q":{"en":"Why should a professional driver keep required driver and vehicle documents ready?","ar":"لماذا يجب على السائق المهني أن يحافظ على جاهزية أوراق السائق والمركبة المطلوبة؟"},"a":[{"en":"They may be required during inspections and prove legal authorization","ar":"قد تُطلب أثناء التفتيش وتثبت الترخيص القانوني"},{"en":"They improve tyre grip","ar":"تحسن تماسك الإطارات"},{"en":"They replace maintenance","ar":"تغني عن الصيانة"},{"en":"They shorten stopping distance","ar":"تقلل مسافة التوقف"}],"correct":0,"exp":{"en":"Public/commercial driving carries additional legal and operational responsibilities.","ar":"القيادة العمومية أو التجارية تتضمن مسؤوليات قانونية وتشغيلية إضافية."}},{"id":233,"tracks":["public"],"cat":"passenger","source":"enforcement","q":{"en":"How should passenger numbers be handled in a public/commercial vehicle?","ar":"كيف يجب التعامل مع عدد الركاب في المركبة العمومية أو التجارية؟"},"a":[{"en":"Stay within the vehicle's legal passenger capacity","ar":"الالتزام بالسعة القانونية للركاب"},{"en":"Carry as many as can physically fit","ar":"نقل أي عدد يمكن أن يدخل فعلياً"},{"en":"Allow standing passengers anywhere","ar":"السماح للركاب بالوقوف في أي مكان"},{"en":"Ignore capacity on short trips","ar":"تجاهل السعة في الرحلات القصيرة"}],"correct":0,"exp":{"en":"Current enforcement specifically includes passenger-count compliance.","ar":"تتضمن حملات الضبط الحالية الالتزام بعدد الركاب المسموح به."}},{"id":234,"tracks":["public"],"cat":"passenger","source":"principle","q":{"en":"What should a public driver do with aisles, doors or emergency access points?","ar":"ماذا يجب أن يفعل السائق العمومي بالنسبة للممرات والأبواب ومخارج الطوارئ؟"},"a":[{"en":"Keep them usable and free from unsafe obstruction where applicable","ar":"يبقيها قابلة للاستعمال وخالية من العوائق الخطرة عند وجودها"},{"en":"Block them with luggage","ar":"يغلقها بالأمتعة"},{"en":"Use them as storage areas","ar":"يستعملها للتخزين"},{"en":"Ignore them until an emergency happens","ar":"يتجاهلها حتى وقوع طارئ"}],"correct":0,"exp":{"en":"Access and exits should remain usable for passenger safety.","ar":"يجب أن تبقى الممرات والمخارج قابلة للاستعمال من أجل سلامة الركاب."}},{"id":235,"tracks":["public"],"cat":"safety","source":"principle","q":{"en":"What should a professional driver do when fatigue starts affecting concentration?","ar":"ماذا يجب على السائق المهني أن يفعل عندما يبدأ التعب بالتأثير على التركيز؟"},"a":[{"en":"Stop safely and rest before continuing","ar":"يتوقف بأمان ويستريح قبل المتابعة"},{"en":"Drink coffee and ignore severe fatigue","ar":"يشرب القهوة ويتجاهل التعب الشديد"},{"en":"Drive faster to finish earlier","ar":"يزيد السرعة لينهي الرحلة أسرع"},{"en":"Use the phone to stay awake","ar":"يستعمل الهاتف للبقاء مستيقظاً"}],"correct":0,"exp":{"en":"A professional driver should not continue when fatigue makes safe driving doubtful.","ar":"لا يجب على السائق المهني متابعة القيادة عندما يجعل التعب القيادة الآمنة موضع شك."}},{"id":236,"tracks":["public"],"cat":"signals","source":"principle","q":{"en":"Before pulling in to pick up a passenger, what should the driver do?","ar":"قبل الاقتراب من جانب الطريق لصعود راكب، ماذا يجب على السائق أن يفعل؟"},"a":[{"en":"Check mirrors, signal early, slow smoothly and choose a safe position","ar":"يفحص المرايا ويعطي الإشارة مبكراً ويخفف بسلاسة ويختار موقعاً آمناً"},{"en":"Brake suddenly at the last moment","ar":"يفرمل فجأة في اللحظة الأخيرة"},{"en":"Stop without signaling","ar":"يتوقف من دون إشارة"},{"en":"Move across lanes sharply","ar":"يقطع المسارات بشكل مفاجئ"}],"correct":0,"exp":{"en":"Early communication and smooth positioning make the stop predictable to others.","ar":"التنبيه المبكر والتموضع السلس يجعلان التوقف متوقعاً لمستخدمي الطريق الآخرين."}},{"id":317,"tracks":["motorcycle"],"cat":"motorcycle","source":"previous_project","q":{"en":"What can help a motorcyclist be more visible at night?","ar":"ما الذي يمكن أن يساعد سائق الدراجة النارية على أن يكون أكثر وضوحاً ليلاً؟"},"a":[{"en":"Reflective or high-visibility material and correctly used lights","ar":"مواد عاكسة أو عالية الوضوح مع استعمال الأضواء بشكل صحيح"},{"en":"Dark clothing and no lights","ar":"ملابس داكنة ومن دون أضواء"},{"en":"Turning off the headlight","ar":"إطفاء المصباح الأمامي"},{"en":"Riding in vehicle blind spots","ar":"السير في النقاط العمياء للمركبات"}],"correct":0,"exp":{"en":"Visibility is a major part of motorcycle safety, especially at night.","ar":"الوضوح للآخرين جزء أساسي من سلامة الدراجة خاصة ليلاً."}},{"id":318,"tracks":["motorcycle"],"cat":"motorcycle","source":"previous_project","q":{"en":"While riding straight, what should you watch for from an oncoming vehicle?","ar":"أثناء سيرك بالدراجة بخط مستقيم، ما الذي يجب الانتباه إليه من مركبة قادمة بالاتجاه المقابل؟"},"a":[{"en":"It may turn across your path unexpectedly","ar":"قد تنعطف فجأة عبر مسارك"},{"en":"It can never enter your path","ar":"لا يمكن أن تدخل مسارك أبداً"},{"en":"It will always stop for you","ar":"ستتوقف لك دائماً"},{"en":"It has no effect on your riding line","ar":"لا تؤثر على مسارك"}],"correct":0,"exp":{"en":"Motorcycles are easy to overlook, so be prepared for a vehicle turning across your route.","ar":"قد لا ينتبه بعض السائقين للدراجات، لذلك كن مستعداً لمركبة تنعطف عبر مسارك."}},{"id":319,"tracks":["motorcycle"],"cat":"motorcycle","source":"previous_project","q":{"en":"How should night riding affect your speed and following distance?","ar":"كيف يجب أن تؤثر القيادة الليلية على سرعتك ومسافة الأمان؟"},"a":[{"en":"Reduce speed when necessary and leave more stopping space","ar":"خفف السرعة عند الحاجة واترك مسافة توقف أكبر"},{"en":"Ride faster because traffic is lighter","ar":"قد أسرع لأن حركة السير أخف"},{"en":"Leave less space","ar":"اترك مسافة أقل"},{"en":"Ride without a headlight","ar":"قد من دون مصباح أمامي"}],"correct":0,"exp":{"en":"Reduced visibility means hazards may be seen later.","ar":"ضعف الرؤية يعني أن المخاطر قد تظهر لك في وقت متأخر."}},{"id":320,"tracks":["motorcycle"],"cat":"motorcycle","source":"previous_project","q":{"en":"What is the main safety benefit of proper motorcycle boots?","ar":"ما الفائدة الأساسية من أحذية الدراجات النارية المناسبة؟"},"a":[{"en":"They help protect the feet and lower legs","ar":"تساعد على حماية القدمين وأسفل الساقين"},{"en":"They increase engine power","ar":"تزيد قوة المحرك"},{"en":"They replace the helmet","ar":"تغني عن الخوذة"},{"en":"They shorten the motorcycle","ar":"تقلل طول الدراجة"}],"correct":0,"exp":{"en":"Purpose-made boots offer more protection from impact, abrasion and weather.","ar":"الأحذية المخصصة توفر حماية أفضل من الصدمات والاحتكاك والطقس."}},{"id":321,"tracks":["motorcycle"],"cat":"motorcycle","source":"previous_project","q":{"en":"Which road-surface hazards can seriously reduce motorcycle grip?","ar":"أي مخاطر على سطح الطريق يمكن أن تقلل تماسك الدراجة بشكل كبير؟"},"a":[{"en":"Oil, gravel, sand or other loose/slippery material","ar":"الزيت والحصى والرمل أو المواد الزلقة وغير الثابتة"},{"en":"Dry clean asphalt only","ar":"الإسفلت الجاف والنظيف فقط"},{"en":"Road signs beside the road","ar":"اللوحات على جانب الطريق"},{"en":"A clear sky","ar":"السماء الصافية"}],"correct":0,"exp":{"en":"A motorcycle has small tyre contact patches, so low-grip surfaces matter greatly.","ar":"مساحة تماس إطارات الدراجة صغيرة، لذلك تؤثر الأسطح ضعيفة التماسك بشكل كبير."}},{"id":322,"tracks":["motorcycle"],"cat":"motorcycle","source":"previous_project","q":{"en":"If a motorcycle has hydraulic brakes, what fluid-related check is useful?","ar":"إذا كانت الدراجة مزودة بفرامل هيدروليكية، ما الفحص المتعلق بالسائل الذي يفيد القيام به؟"},"a":[{"en":"Check the brake-fluid level and system condition","ar":"فحص مستوى سائل الفرامل وحالة النظام"},{"en":"Drain the fluid before every ride","ar":"تفريغ السائل قبل كل رحلة"},{"en":"Add engine oil to the brake reservoir","ar":"إضافة زيت المحرك إلى خزان الفرامل"},{"en":"Ignore fluid level until braking fails","ar":"تجاهل مستوى السائل حتى تتعطل الفرامل"}],"correct":0,"exp":{"en":"Hydraulic braking depends on the correct fluid level and a sound system.","ar":"الفرامل الهيدروليكية تعتمد على مستوى سائل صحيح ونظام سليم."}},{"id":323,"tracks":["motorcycle"],"cat":"motorcycle","source":"principle","q":{"en":"What riding position usually gives better control of the handlebars?","ar":"ما وضعية القيادة التي تمنح عادةً تحكماً أفضل بالمقود؟"},"a":[{"en":"A balanced position with relaxed arms and easy reach to the controls","ar":"وضعية متوازنة مع ذراعين مرتاحتين ووصول سهل إلى أدوات التحكم"},{"en":"Arms locked completely straight","ar":"ذراعان مستقيمان ومقفلان تماماً"},{"en":"Sitting so far back you can barely reach","ar":"الجلوس بعيداً لدرجة صعوبة الوصول"},{"en":"Holding the handlebar with one hand in normal riding","ar":"إمساك المقود بيد واحدة أثناء القيادة العادية"}],"correct":0,"exp":{"en":"A relaxed, balanced position supports steering and control.","ar":"الوضعية المتوازنة والمريحة تساعد على التوجيه والتحكم."}},{"id":324,"tracks":["motorcycle"],"cat":"motorcycle","source":"previous_project","q":{"en":"For normal controlled braking on a motorcycle, how should the brakes generally be used?","ar":"في الفرملة العادية والمنضبطة على الدراجة، كيف يجب استعمال الفرامل عموماً؟"},"a":[{"en":"Use both brakes progressively and smoothly","ar":"استعمل الفرامل الأمامية والخلفية تدريجياً وبسلاسة"},{"en":"Use the rear brake only in every situation","ar":"استعمل الفرامل الخلفية فقط في كل الحالات"},{"en":"Use the front brake as an on/off switch","ar":"استعمل الفرامل الأمامية بشكل مفاجئ"},{"en":"Put a foot on the road to stop","ar":"ضع قدمك على الطريق للتوقف"}],"correct":0,"exp":{"en":"Progressive use of both brakes normally provides stronger, more balanced braking.","ar":"الاستعمال التدريجي للفرامل الأمامية والخلفية يوفر عادة فرملة أقوى وأكثر توازناً."}},{"id":325,"tracks":["motorcycle"],"cat":"motorcycle","source":"previous_project","q":{"en":"Why are motorcycle gloves useful?","ar":"لماذا تعتبر قفازات الدراجات النارية مفيدة؟"},"a":[{"en":"They protect the hands and improve grip in difficult weather","ar":"تحمي اليدين وتساعد على الإمساك بالمقود في الظروف الصعبة"},{"en":"They replace the helmet","ar":"تغني عن الخوذة"},{"en":"They increase tyre pressure","ar":"تزيد ضغط الإطارات"},{"en":"They eliminate the need to brake","ar":"تلغي الحاجة إلى الفرامل"}],"correct":0,"exp":{"en":"Hands are exposed in a fall and need both protection and control.","ar":"اليدان معرضتان للإصابة عند السقوط وتحتاجان للحماية مع الحفاظ على التحكم."}},{"id":326,"tracks":["motorcycle"],"cat":"motorcycle","source":"previous_project","q":{"en":"How should you approach an intersection on a motorcycle?","ar":"كيف يجب أن تقترب من تقاطع على دراجة نارية؟"},"a":[{"en":"Reduce speed as needed, choose the correct lane and observe for conflicts","ar":"خفف السرعة عند الحاجة واختر المسار الصحيح وراقب نقاط التعارض"},{"en":"Accelerate through without checking","ar":"تسارع واعبر من دون مراقبة"},{"en":"Ride between stopped vehicles automatically","ar":"سر بين المركبات المتوقفة تلقائياً"},{"en":"Look only at the vehicle ahead","ar":"انظر فقط إلى المركبة أمامك"}],"correct":0,"exp":{"en":"Intersections are high-conflict areas and require extra observation.","ar":"التقاطعات مناطق كثيرة التعارض وتحتاج إلى مراقبة إضافية."}},{"id":327,"tracks":["motorcycle"],"cat":"motorcycle","source":"previous_project","q":{"en":"What happens to risk when a motorcyclist weaves unpredictably between vehicles?","ar":"ماذا يحدث للخطر عندما يقود سائق الدراجة بشكل متعرج وغير متوقع بين المركبات؟"},"a":[{"en":"The risk of collision increases","ar":"يزداد خطر الاصطدام"},{"en":"The risk disappears","ar":"يختفي الخطر"},{"en":"Other drivers can always predict the motorcycle","ar":"يستطيع الآخرون توقع حركة الدراجة دائماً"},{"en":"Braking distance becomes zero","ar":"تصبح مسافة الفرملة صفراً"}],"correct":0,"exp":{"en":"Unpredictable movement reduces the time other drivers have to see and react.","ar":"الحركة غير المتوقعة تقلل الوقت المتاح للآخرين لرؤية الدراجة والتصرف."}},{"id":328,"tracks":["motorcycle"],"cat":"motorcycle","source":"previous_project","q":{"en":"When overtaking another vehicle on a motorcycle, what is the normal lawful side?","ar":"عند تجاوز مركبة أخرى بالدراجة، ما هي الجهة المعتادة قانونياً للتجاوز؟"},"a":[{"en":"The left, when overtaking is permitted and safe","ar":"اليسار عندما يكون التجاوز مسموحاً وآمناً"},{"en":"The right in every situation","ar":"اليمين في كل الحالات"},{"en":"The sidewalk","ar":"الرصيف"},{"en":"Any side without observation","ar":"أي جهة من دون مراقبة"}],"correct":0,"exp":{"en":"Motorcycle overtaking follows the same basic road rules as other vehicles.","ar":"تجاوز الدراجة يخضع للقواعد الأساسية نفسها التي تخضع لها المركبات الأخرى."}},{"id":329,"tracks":["motorcycle"],"cat":"motorcycle","source":"previous_project","q":{"en":"What can proper motorcycle eye protection help protect against?","ar":"ممّ تساعد حماية العين المناسبة لسائق الدراجة؟"},"a":[{"en":"Wind, dust, rain and insects","ar":"الرياح والغبار والمطر والحشرات"},{"en":"Only engine noise","ar":"صوت المحرك فقط"},{"en":"Only cold feet","ar":"برودة القدمين فقط"},{"en":"Fuel consumption","ar":"استهلاك الوقود"}],"correct":0,"exp":{"en":"Clear protected vision is important for control and hazard detection.","ar":"الرؤية الواضحة والمحمية مهمة للتحكم واكتشاف المخاطر."}},{"id":330,"tracks":["motorcycle"],"cat":"motorcycle","source":"law","q":{"en":"How should a protective motorcycle helmet be used?","ar":"كيف يجب استعمال خوذة الدراجة النارية الواقية؟"},"a":[{"en":"Wear it correctly and fasten it securely","ar":"تُرتدى بشكل صحيح وتُثبت بإحكام"},{"en":"Carry it on the arm","ar":"تُحمل على الذراع"},{"en":"Wear it without fastening","ar":"تُلبس من دون تثبيت"},{"en":"Use it only outside cities","ar":"تُستعمل فقط خارج المدن"}],"correct":0,"exp":{"en":"Lebanese Traffic Law requires the protective helmet to be worn and secured.","ar":"يفرض قانون السير اللبناني ارتداء الخوذة الواقية وتثبيتها بشكل صحيح."}},{"id":331,"tracks":["motorcycle"],"cat":"motorcycle","source":"principle","q":{"en":"What is the purpose of a motorcycle back/spine protector?","ar":"ما الغرض من واقي الظهر أو العمود الفقري الخاص بالدراجات؟"},"a":[{"en":"To reduce injury risk to the back/spine in an impact","ar":"لتقليل خطر إصابة الظهر والعمود الفقري عند الصدمة"},{"en":"To replace the helmet","ar":"ليحل محل الخوذة"},{"en":"To increase top speed","ar":"لزيادة السرعة القصوى"},{"en":"To improve fuel quality","ar":"لتحسين نوعية الوقود"}],"correct":0,"exp":{"en":"Protective equipment can reduce injury severity in a crash.","ar":"معدات الحماية قد تقلل شدة الإصابة عند وقوع حادث."}},{"id":332,"tracks":["motorcycle"],"cat":"motorcycle","source":"previous_project","q":{"en":"Why is purpose-made motorcycle clothing useful in a slide?","ar":"لماذا تكون الملابس المخصصة للدراجات مفيدة عند الانزلاق؟"},"a":[{"en":"It offers better abrasion and impact protection than ordinary clothing","ar":"توفر حماية أفضل من الاحتكاك والصدمات مقارنة بالملابس العادية"},{"en":"It guarantees no injury","ar":"تضمن عدم حدوث أي إصابة"},{"en":"It makes braking unnecessary","ar":"تلغي الحاجة إلى الفرامل"},{"en":"It prevents all skids","ar":"تمنع جميع حالات الانزلاق"}],"correct":0,"exp":{"en":"Protective clothing cannot prevent every injury, but it can reduce abrasion and impact damage.","ar":"الملابس الواقية لا تمنع كل الإصابات لكنها قد تقلل أضرار الاحتكاك والصدمات."}},{"id":333,"tracks":["motorcycle"],"cat":"motorcycle","source":"previous_project","q":{"en":"What clothing choice can improve a rider's visibility at night or in poor light?","ar":"أي اختيار للملابس يمكن أن يحسن رؤية سائق الدراجة ليلاً أو في الإضاءة الضعيفة؟"},"a":[{"en":"High-visibility or reflective clothing","ar":"ملابس عالية الوضوح أو عاكسة للضوء"},{"en":"Only dark matte clothing","ar":"ملابس داكنة غير عاكسة فقط"},{"en":"Clothing that covers the headlight","ar":"ملابس تغطي المصباح الأمامي"},{"en":"Any color makes no difference","ar":"لا فرق لأي لون"}],"correct":0,"exp":{"en":"Reflective or high-visibility material makes the rider easier to detect.","ar":"المواد العاكسة أو عالية الوضوح تجعل اكتشاف السائق أسهل."}},{"id":334,"tracks":["motorcycle"],"cat":"motorcycle","source":"principle","q":{"en":"What changes when carrying a passenger on a motorcycle?","ar":"ماذا يتغير عند نقل راكب إضافي على الدراجة؟"},"a":[{"en":"Weight, balance, acceleration and stopping distance can change","ar":"قد يتغير الوزن والتوازن والتسارع ومسافة التوقف"},{"en":"Nothing changes at all","ar":"لا يتغير شيء أبداً"},{"en":"The brakes become stronger automatically","ar":"تصبح الفرامل أقوى تلقائياً"},{"en":"The motorcycle no longer needs mirrors","ar":"لا تعود الدراجة بحاجة للمرايا"}],"correct":0,"exp":{"en":"An additional passenger changes the motorcycle's mass and handling.","ar":"الراكب الإضافي يغير كتلة الدراجة وطريقة تحكمها."}},{"id":1001,"tracks":["all"],"cat":"overtaking","source":"traffic_2019","q":{"en":"When visibility is poor because of rain or fog, what should you do about overtaking?","ar":"عندما تكون الرؤية غير كافية بسبب المطر أو الضباب، ماذا يجب أن تفعل بشأن التجاوز?"},"a":[{"en":"Avoid overtaking until visibility is sufficient","ar":"تجنب التجاوز حتى تصبح الرؤية كافية"},{"en":"Overtake quickly","ar":"تجاوز بسرعة"},{"en":"Use the horn and overtake","ar":"استعمل الزمور وتجاوز"},{"en":"Drive on the shoulder","ar":"سر على الكتف"}],"correct":0,"exp":{"en":"The 2019 guide lists overtaking when visibility is insufficient, especially in rain or fog, as a violation.","ar":"يذكر دليل 2019 التجاوز عندما تكون الرؤية غير كافية، ولا سيما أثناء المطر أو الضباب، ضمن المخالفات."}},{"id":1002,"tracks":["all"],"cat":"overtaking","source":"traffic_2019","q":{"en":"What should a driver being overtaken avoid doing during the overtaking manoeuvre?","ar":"ماذا يجب على السائق الذي يتم تجاوزه أن يتجنب أثناء مناورة التجاوز؟"},"a":[{"en":"Increasing speed","ar":"زيادة السرعة"},{"en":"Keeping right when safe","ar":"الالتزام باليمين عندما يكون ذلك آمناً"},{"en":"Maintaining a predictable course","ar":"الحفاظ على مسار متوقع"},{"en":"Watching mirrors","ar":"مراقبة المرايا"}],"correct":0,"exp":{"en":"The 2019 guide lists increasing speed while another driver is overtaking as a serious violation.","ar":"يذكر دليل 2019 زيادة السائق المراد تجاوزه لسرعته أثناء مناورة التجاوز كمخالفة خطرة."}},{"id":1003,"tracks":["all"],"cat":"overtaking","source":"traffic_2019","q":{"en":"When an emergency vehicle approaches using its special warning signals, what should you do?","ar":"عند اقتراب مركبة طوارئ مستخدمة إشاراتها الخاصة، ماذا يجب أن تفعل؟"},"a":[{"en":"Keep right, reduce speed and make room safely","ar":"التزم اليمين وخفف السرعة وافسح المجال بأمان"},{"en":"Race ahead of it","ar":"تسابق أمامها"},{"en":"Stop in the middle of the lane","ar":"توقف في وسط المسار"},{"en":"Ignore it","ar":"تجاهلها"}],"correct":0,"exp":{"en":"The traffic-law guide requires drivers to facilitate passage for armed forces, fire, ambulance and civil-defense vehicles using special signals.","ar":"يوجب دليل قانون السير تسهيل مرور مركبات القوى المسلحة والإطفاء والإسعاف والدفاع المدني عند استعمال إشاراتها الخاصة."}},{"id":1004,"tracks":["all"],"cat":"pedestrians","source":"traffic_2019","q":{"en":"What should you do when pedestrians need to cross and you are required to let them pass?","ar":"ماذا تفعل عندما يحتاج المشاة إلى العبور ويجب السماح لهم بالمرور؟"},"a":[{"en":"Slow or stop to let them cross safely","ar":"خفف السرعة أو توقف للسماح لهم بالعبور بأمان"},{"en":"Accelerate before they step out","ar":"تسارع قبل نزولهم"},{"en":"Sound the horn continuously","ar":"استعمل الزمور باستمرار"},{"en":"Drive around them","ar":"التف حولهم"}],"correct":0,"exp":{"en":"The 2019 guide lists failure to stop or slow for pedestrians and persons with disabilities as a serious violation.","ar":"يذكر دليل 2019 عدم التوقف أو تخفيف السرعة للسماح بمرور المشاة والأشخاص ذوي الإعاقة كمخالفة خطرة."}},{"id":1005,"tracks":["all"],"cat":"pedestrians","source":"traffic_2019","q":{"en":"Near a school entrance or a stopped school bus, what should a driver do?","ar":"قرب مدخل مدرسة أو عند توقف حافلة مدرسية، ماذا يجب على السائق أن يفعل؟"},"a":[{"en":"Give priority to students and be ready to stop","ar":"أعطِ الأولوية للتلامذة وكن مستعداً للتوقف"},{"en":"Overtake immediately","ar":"تجاوز فوراً"},{"en":"Use high beams","ar":"استعمل الضوء العالي"},{"en":"Maintain speed regardless of children","ar":"حافظ على السرعة مهما كان وجود الأطفال"}],"correct":0,"exp":{"en":"The 2019 guide lists failure to give students priority at school entrances and stopped school buses as a serious violation.","ar":"يذكر دليل 2019 عدم إعطاء الأفضلية للتلامذة عند مداخل المدارس وعند توقف حافلات المدارس كمخالفة خطرة."}},{"id":1006,"tracks":["all"],"cat":"overtaking","source":"traffic_2019","q":{"en":"Is overtaking inside a roundabout a good practice?","ar":"هل التجاوز داخل المستديرة ممارسة صحيحة؟"},"a":[{"en":"No; avoid overtaking inside the roundabout","ar":"لا؛ تجنب التجاوز داخل المستديرة"},{"en":"Yes, always","ar":"نعم دائماً"},{"en":"Only using the horn","ar":"فقط مع استعمال الزمور"},{"en":"Only from the right","ar":"فقط من اليمين"}],"correct":0,"exp":{"en":"The 2019 guide lists overtaking within a roundabout as a violation.","ar":"يذكر دليل 2019 التجاوز ضمن المستديرة كمخالفة."}},{"id":1007,"tracks":["all"],"cat":"overtaking","source":"traffic_2019","q":{"en":"When approaching a narrow bridge or narrow one-lane-per-direction tunnel, what should you avoid?","ar":"عند الاقتراب من جسر ضيق أو نفق ضيق بمسرب واحد لكل اتجاه، ماذا يجب أن تتجنب؟"},"a":[{"en":"Overtaking","ar":"التجاوز"},{"en":"Reducing speed","ar":"تخفيف السرعة"},{"en":"Observing signs","ar":"مراقبة الإشارات"},{"en":"Keeping a safe gap","ar":"ترك مسافة أمان"}],"correct":0,"exp":{"en":"The traffic-law guide lists overtaking on narrow bridges and narrow tunnels of one lane per direction as a serious violation.","ar":"يذكر دليل قانون السير التجاوز على الجسور الضيقة والأنفاق الضيقة ذات المسرب الواحد لكل اتجاه كمخالفة خطرة."}},{"id":1008,"tracks":["all"],"cat":"priority","source":"traffic_2019","q":{"en":"On a steep or mountainous road where vehicles meet, which general safety principle applies?","ar":"على طريق جبلي أو شديد الانحدار عند تلاقي مركبتين، ما المبدأ العام للسلامة؟"},"a":[{"en":"Follow the priority rules and be prepared to yield or reverse when required","ar":"اتبع قواعد الأفضلية وكن مستعداً لإعطاء الأولوية أو الرجوع عند الحاجة"},{"en":"Both drivers accelerate","ar":"يتسارع السائقان"},{"en":"The larger vehicle always has absolute priority","ar":"المركبة الأكبر لها دائماً أولوية مطلقة"},{"en":"Stop side by side","ar":"توقفا جنباً إلى جنب"}],"correct":0,"exp":{"en":"The 2019 guide contains specific priority and reversing duties for vehicles meeting on mountain or sloped roads.","ar":"يتضمن دليل 2019 قواعد خاصة للأفضلية والرجوع عند تلاقي المركبات على الطرق الجبلية أو المنحدرة."}},{"id":1009,"tracks":["all"],"cat":"signs","source":"traffic_education","q":{"en":"What is one main purpose of traffic signs?","ar":"ما أحد الأهداف الرئيسية لإشارات المرور؟"},"a":[{"en":"To warn, regulate and guide road users","ar":"التحذير والتنظيم وإرشاد مستخدمي الطريق"},{"en":"To decorate roads","ar":"لتزيين الطرق"},{"en":"To replace driver observation","ar":"لاستبدال مراقبة السائق"},{"en":"To increase traffic speed everywhere","ar":"لزيادة سرعة السير في كل مكان"}],"correct":0,"exp":{"en":"The Lebanese traffic-sign education guide says signs guide priorities, regulate intersections, define speed and warn of danger.","ar":"يذكر ملحق العلامات المرورية اللبناني أن الإشارات ترشد إلى الأولويات وتنظم التقاطعات وتحدد السرعة وتحذر من الأخطار."}},{"id":1010,"tracks":["all"],"cat":"signs","source":"traffic_education","q":{"en":"Which group is explicitly listed as a traffic-sign family in the Lebanese educational guide?","ar":"أي مجموعة مذكورة صراحة كنوع من أنواع العلامات المرورية في الملحق اللبناني؟"},"a":[{"en":"Warning signs","ar":"علامات تحذيرية"},{"en":"Entertainment signs","ar":"علامات ترفيهية"},{"en":"Advertising signs","ar":"علامات إعلانية"},{"en":"Private-store signs","ar":"علامات المحلات الخاصة"}],"correct":0,"exp":{"en":"The guide divides signs into warning, prohibitory/regulatory, guidance/directional and work-zone types.","ar":"يقسم الملحق العلامات إلى تحذيرية ومانعة أو تنظيمية وإرشادية أو توجيهية ومناطق عمل."}},{"id":1011,"tracks":["all"],"cat":"signs","source":"traffic_education","q":{"en":"What does a “No horn” sign require?","ar":"ماذا تعني إشارة «ممنوع استعمال آلة التنبيه»؟"},"a":[{"en":"Do not use the horn in the indicated area except as legally necessary","ar":"عدم استعمال آلة التنبيه في المنطقة المشار إليها إلا عند الضرورة القانونية"},{"en":"Use the horn continuously","ar":"استعمال الزمور باستمرار"},{"en":"Use only high beams","ar":"استعمال الضوء العالي فقط"},{"en":"Stop the vehicle permanently","ar":"إيقاف المركبة نهائياً"}],"correct":0,"exp":{"en":"The educational guide explains that the sign prohibits horn use, commonly near hospitals or residential areas.","ar":"يشرح الملحق أن الإشارة تمنع استعمال آلة التنبيه، وغالباً ما تكون قرب المستشفيات أو المناطق السكنية."}},{"id":1012,"tracks":["all"],"cat":"signs","source":"traffic_education","q":{"en":"What does “Priority to oncoming traffic” tell you?","ar":"ماذا تعني إشارة «الأولوية للقادم»؟"},"a":[{"en":"Give priority to vehicles coming from the opposite direction","ar":"أعطِ الأفضلية للمركبات القادمة من الاتجاه المقابل"},{"en":"You always have priority","ar":"لك الأفضلية دائماً"},{"en":"Road is closed","ar":"الطريق مغلق"},{"en":"Overtaking is mandatory","ar":"التجاوز إلزامي"}],"correct":0,"exp":{"en":"The Lebanese educational guide states that this sign gives priority to facing/oncoming vehicles.","ar":"يذكر الملحق اللبناني أن هذه الإشارة تعطي الأفضلية للسيارات المواجهة."}},{"id":1013,"tracks":["all"],"cat":"parking","source":"traffic_2019","q":{"en":"What is wrong with parking so that it blocks a road sign or traffic signal?","ar":"ما الخطأ في الوقوف بطريقة تحجب لافتة طريق أو إشارة ضوئية؟"},"a":[{"en":"It is prohibited because it hides important traffic information","ar":"هو ممنوع لأنه يحجب معلومات مرورية مهمة"},{"en":"It is allowed for ":[{"en":"Tyres, lights, fluids, brakes and required documents","ar":"الإطارات والأضواء والسوائل والفرامل والأوراق المطلوبة"},{"en":"Only radio stations","ar":"محطات الراديو فقط"},{"en":"Only seat colour","ar":"لون المقاعد فقط"},{"en":"Only phone battery","ar":"بطارية الهاتف فقط"}],"correct":0,"exp":{"en":"A basic pre-trip check helps prevent avoidable mechanical and legal problems.","ar":"الفحص الأساسي قبل الرحلة يساعد على تفادي مشاكل ميكانيكية وقانونية يمكن تجنبها."}},{"id":1017,"tracks":["all"],"cat":"weather","source":"principle","q":{"en":"On a wet road, how should your following distance change?","ar":"على طريق مبلل، كيف يجب أن تتغير مسافة الأمان؟"},"a":[{"en":"Increase it","ar":"زدها"},{"en":"Reduce it","ar":"خففها"},{"en":"Keep zero gap","ar":"اجعلها صفراً"},{"en":"Ignore road conditions","ar":"تجاهل حالة الطريق"}],"correct":0,"exp":{"en":"Wet surfaces can increase stopping distance, so more space is safer.","ar":"السطح المبلل قد يزيد مسافة التوقف، لذلك المسافة الأكبر أكثر أماناً."}},{"id":1018,"tracks":["all"],"cat":"safety","source":"principle","q":{"en":"What is the safest response if another driver behaves aggressively?","ar":"ما التصرف الأكثر أماناً إذا كان سائق آخر يتصرف بعدوانية؟"},"a":[{"en":"Create space and avoid confrontation","ar":"اترك مسافة وتجنب المواجهة"},{"en":"Compete with them","ar":"نافسه"},{"en":"Brake-check them","ar":"افرمل أمامه عمداً"},{"en":"Follow them closely","ar":"اتبعه عن قرب"}],"correct":0,"exp":{"en":"Space and calm reduce escalation and collision risk.","ar":"ترك المسافة والهدوء يقللان التصعيد وخطر الحوادث."}},{"id":1019,"tracks":["all"],"cat":"signals","source":"principle","q":{"en":"Why should you cancel a turn signal after completing the manoeuvre?","ar":"لماذا يجب إلغاء إشارة الانعطاف بعد إتمام المناورة؟"},"a":[{"en":"To avoid misleading other road users","ar":"لتجنب تضليل مستخدمي الطريق الآخرين"},{"en":"To save fuel","ar":"لتوفير الوقود"},{"en":"To increase speed","ar":"لزيادة السرعة"},{"en":"To improve braking","ar":"ل rate to finish quickly","ar":"تسارع لإنهاء المناورة بسرعة"},{"en":"Continue without checking","ar":"تابع دون فحص"},{"en":"Turn randomly","ar":"لف المقود عشوائياً"}],"correct":0,"exp":{"en":"A controlled correction is safer than forcing a bad angle.","ar":"التصحيح المنظم أكثر أماناً من إجبار السيارة على زاوية سيئة."}},{"id":1103,"tracks":["private"],"cat":"safety","source":"principle","q":{"en":"When joining traffic from a parked position, when should you move?","ar":"عند الانضمام إلى حركة السير من موقف، متى يجب أن تتحرك؟"},"a":[{"en":"Only when mirrors and blind-spot checks show it is safe","ar":"فقط عندما تؤكد المرايا والنقطة العمياء أن الطريق آمن"},{"en":"As soon as the engine starts","ar":"بمجرد تشغيل المحرك"},{"en":"When another driver honks","ar":"عندما يزمّر سائق آخر"},{"en":"Whenever your indicator is on","ar":"كلما كانت الإشارة تعمل"}],"correct":0,"exp":{"en":"A signal does not give priority; observation must confirm a safe gap.","ar":"الإشارة لا تعطيك الأفضلية؛ يجب أن تؤكد المراقبة وجود فجوة آمنة."}},{"id":1104,"tracks":["private"],"cat":"vehicle","source":"principle","q":{"en":"What can incorrect seat position affect?","ar":"على ماذا قد تؤثر وضعية المقعد غير الصحيحة؟"},"a":[{"en":"Steering, pedal control and observation","ar":"التحكم بالمقود والدواسات والمراقبة"},{"en":"Only radio sound","ar":"صوت الراديو فقط"},{"en":"Fuel type","ar":"نوع الوقود"},{"en":"Road signs","ar":"إشارات الطريق"}],"correct":0,"exp":{"en":"You need a stable seating position with full control of pedals and steering.","ar":"تحتاج إلى وضعية جلوس ثابتة تسمح بالتحكم الكامل بالدواسات والمقود."}},{"id":1105,"tracks":["private"],"cat":"parking","source":"principle","q":{"en":"While reversing into a garage space, where should your attention be?","ar":"أثناء الرجوع إلى موقف مرآب، أين يجب أن يكون انتباهك؟"},"a":[{"en":"All around the vehicle, not only one mirror","ar":"حول السيارة كلها وليس في مرآة واحدة فقط"},{"en":"Only the rear camera","ar":"الكاميرا الخلفية فقط"},{"en":"Only the left mirror","ar":"المرآة اليسرى فقط"},{"en":"Only the steering wheel","ar":"المقود فقط"}],"correct":0,"exp":{"en":"Reversing requires continuous all-round observation.","ar":"الرجوع إلى الخلف يتطلب مراقبة مستمرة لمحيط السيارة بالكامل."}},{"id":1106,"tracks":["private"],"cat":"safety","source":"principle","q":{"en":"What should you do before opening your door on the traffic side?","ar":"ماذا يجب أن تفعل قبل فتح الباب من جهة حركة السير؟"},"a":[{"en":"Check mirrors and beside/behind the car for cyclists, motorcycles and vehicles","ar":"افحص المرايا وجانب وخلف السيارة للدراجات والمركبات"},{"en":"Open immediately","ar":"افتح فوراً"},{"en":"Sound the horn first","ar":"استعمل الزمور أولاً"},{"en":"Switch on high beams","ar":"شغل الضوء العالي"}],"correct":0,"exp":{"en":"A door opened into traffic can strike a passing road user.","ar":"فتح الباب باتجاه السير قد يصدم مستخدماً للطريق يمر بجانب السيارة."}},{"id":1107,"tracks":["private"],"cat":"weather","source":"principle","q":{"en":"If your windscreen fogs up, what should you do?","ar":"إذا تكثف الضباب على الزجاج الأمامي، ماذا تفعل؟"},"a":[{"en":"Restore clear visibility before continuing normally","ar":"أعد الرؤية الواضحة قبل متابعة القيادة بشكل طبيعي"},{"en":"Look through a small gap only","ar":"انظر من فتحة صغيرة فقط"},{"en":"Drive faster","ar":"قد أسرع"},{"en":"Turn off ventilation permanently","ar":"أطفئ التهوية نهائياً"}],"correct":0,"exp":{"en":"Clear visibility is essential for safe observation.","ar":"الرؤية الواضحة أساسية للمراقبة الآمنة."}},{"id":1108,"tracks":["private"],"cat":"parking","source":"principle","q":{"en":"When parking on a slope, what should you make sure of before leaving the car?","ar":"عند ركن السيارة على منحدر، ماذا يجب أن تتأكد منه قبل مغادرتها؟"},"a":[{"en":"The vehicle is securely prevented from rolling","ar":"أن المركبة مثبتة بحيث لا تتحرك"},{"en":"The engine is revving","ar":"أن المحرك يعمل بسرعة عالية"},{"en":"The doors remain open","ar":"أن الأبواب مفتوحة"},{"en":"The horn is on","ar":"أن الزمور يعم
